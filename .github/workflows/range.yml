name: Range (single-host four-zone)

# 票 #13 / WS6 Slice 1：在 GitHub runner（有 root，免巢狀虛擬化）用 OVS + netns +
# nftables 建四區 range，實測四條跨世代契約 + 六台 red source IP 可分辨。
# 真 VM（Slice 2）才需要大主機的 nested KVM，那部分不在此 workflow。
on:
  push:
    branches: [master]
    paths:
      - "scripts/range/**"
      - "scripts/verify_topology.py"
      - "src/purple/topology_check.py"
      - ".github/workflows/range.yml"
  pull_request:
    branches: [master]
    paths:
      - "scripts/range/**"
      - "scripts/verify_topology.py"
      - "src/purple/topology_check.py"
      - ".github/workflows/range.yml"
  workflow_dispatch:

jobs:
  range-slice1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Open vSwitch + nftables
        run: |
          sudo apt-get update
          sudo apt-get install -y openvswitch-switch nftables
          sudo systemctl start openvswitch-switch || sudo /usr/share/openvswitch/scripts/ovs-ctl start

      # build 起的 mgmt listener 是背景行程；build 與 verify 放同一 step，
      # 確保 listener 在契約 1 驗收時仍存活。
      - name: Build four-zone range + verify contracts
        run: |
          sudo bash scripts/range/build-range.sh
          sudo bash scripts/range/verify-range.sh

      # 刻意拿掉 Contract 1 的 dport allowlist 再重建。Z-MGMT 的 :22 deny canary
      # 有 listener，因此這一步若沒有失敗，代表反向斷言已失去抓退化的能力。
      - name: Contract 1 negative assertion can fail
        run: |
          set -u
          sed -i \
            's/ip saddr $TARGET_CIDR ip daddr $MGMT_CIDR tcp dport { 3100, 9090, 4317 } accept/ip saddr $TARGET_CIDR ip daddr $MGMT_CIDR accept/' \
            scripts/range/build-range.sh
          grep -Fq 'ip saddr $TARGET_CIDR ip daddr $MGMT_CIDR accept' scripts/range/build-range.sh
          sudo bash scripts/range/build-range.sh
          source scripts/range/zones.env
          set +e
          output="$(sudo ip netns exec ns-target python3 scripts/verify_topology.py \
            --from-zone target --mgmt "$MGMT_STUB_IP" 2>&1)"
          rc=$?
          set -e
          echo "$output"
          if [ "$rc" -ne 1 ]; then
            echo "::error::預期契約退化 exit 1，實得 exit $rc"
            exit 1
          fi
          grep -Fq '非 telemetry :22 竟然通了' <<<"$output" || {
            echo "::error::失敗原因不是 TARGET→MGMT :22 被放行"
            exit 1
          }
          echo "反向斷言如預期抓到 TARGET→MGMT :22 被錯誤放行"
          git restore scripts/range/build-range.sh
          sudo bash scripts/range/build-range.sh

      - name: Show router ruleset + OVS topology (always)
        if: always()
        run: |
          echo "--- nftables ruleset (ns-router) ---"
          sudo ip netns exec ns-router nft list ruleset || true
          echo "--- OVS ---"
          sudo ovs-vsctl show || true
          echo "--- netns ---"
          sudo ip netns list || true

      - name: Teardown
        if: always()
        run: sudo bash scripts/range/teardown-range.sh
