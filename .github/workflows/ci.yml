name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# PR：連推三次只跑最後一次，前兩次直接取消。
# master：每個 commit 自己一個群組（群組名帶 sha）。只寫 ref 的話，群組相同
# 又不取消＝後面的 commit 排隊等前一個，回饋更慢；而 master 上每個 commit 的
# 結果都要留存，才知道是哪一個把主線弄紅的，所以也不能取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Shell 是這個專案的一等公民（deploy.sh / test.sh / scripts/range/* / bake.sh 都是），
  # 但過去只靠 `bash -n` 把關 —— 那只驗語法，驗不了語意。
  # 2026-08-10 實測：一次折行的跳脫寫錯，讓 bake.sh 出現字面的 `\n` 當成 curl 的第二個
  # URL，curl exit 6（無法解析主機）。`bash -n` 完全過關，因為那行語法合法、只是參數錯，
  # 而錯誤要跑到大主機、烤一顆 VM、42 秒後才浮現。
  # shellcheck 的 SC1012（warning 級）正是為這種情形存在的，訊息就直說
  # 「那個跳脫只是字面的 n」。已用當時那一行實測過，這道閘門確實會紅。
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          shellcheck --version
          # bake.sh 跑在 VM 內、由 cloud-init 呼叫，不是 sourced，一併檢查。
          # -x 讓它跟著 source 進去（zones.env / lib-*.sh 的變數才認得出來）。
          shellcheck -x -S warning \
            deploy.sh test.sh \
            scripts/*.sh scripts/range/*.sh \
            deploy/range-target/bake.sh \
            deploy/range-target/inject-flag.sh

  test:
    runs-on: ubuntu-latest

    # 全部測試都需要 PostgreSQL（2026-08-08 決定，見 map.md）。
    # 不分層：不分層才不會有「本機綠、CI 紅」的落差。service container 就是
    # 那個「一律需要的 PG」在 CI 這一側的具體來源。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: purple
          POSTGRES_PASSWORD: purple
          POSTGRES_DB: purple
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U purple -d purple"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # PG 已由 service container 起好，別再試 docker compose。
      PURPLE_AUTO_COMPOSE: "0"
      PURPLE_PG_DSN: postgresql://purple:purple@localhost:5432/purple

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit and contract tests
        # integration 全棧測試在 integration.yml 跑（需要 docker compose）
        run: python -m pytest -q -m "not integration"

      # 時鐘檢查在 CI 只有 runner 自己一個節點，但這一步存在是為了證明
      # CLI 的退出碼真的會傳播 —— 檢查壞掉時 CI 必須紅。
      - name: Clock sync check
        run: python -m purple.clock.cli

  # 這個 job 的唯一目的：證明上面的檢查會紅。
  # 一個從不會紅的 CI，比沒有 CI 更糟（同 02a 對測試載具的要求）。
  clock-check-can-fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: A node that cannot be read must fail the check
        run: |
          cat > /tmp/red.yaml <<'EOF'
          threshold_ms: 100
          reference: checker-host
          nodes:
            - name: checker-host
              probe: local
            - name: ghost
              probe: docker
              container: does-not-exist
          EOF
          if python -m purple.clock.cli --config /tmp/red.yaml; then
            echo "::error::時鐘檢查對讀不到的節點回報成功 —— 檢查已經失效"
            exit 1
          fi
          echo "檢查如預期失敗"

      - name: A broken config must fail the check
        run: |
          if python -m purple.clock.cli --config /tmp/does-not-exist.yaml; then
            echo "::error::缺少設定檔卻回報成功 —— 檢查已經失效"
            exit 1
          fi
          echo "檢查如預期失敗"
