name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # 全部測試都需要 PostgreSQL（2026-08-08 決定，見 map.md）。
    # 不分層：不分層才不會有「本機綠、CI 紅」的落差。service container 就是
    # 那個「一律需要的 PG」在 CI 這一側的具體來源。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: purple
          POSTGRES_PASSWORD: purple
          POSTGRES_DB: purple
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U purple -d purple"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # PG 已由 service container 起好，別再試 docker compose。
      PURPLE_AUTO_COMPOSE: "0"
      PURPLE_PG_DSN: postgresql://purple:purple@localhost:5432/purple

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit and contract tests
        # integration 全棧測試在 integration.yml 跑（需要 docker compose）
        run: python -m pytest -q -m "not integration"

      # 時鐘檢查在 CI 只有 runner 自己一個節點，但這一步存在是為了證明
      # CLI 的退出碼真的會傳播 —— 檢查壞掉時 CI 必須紅。
      - name: Clock sync check
        run: python -m purple.clock.cli

  # 這個 job 的唯一目的：證明上面的檢查會紅。
  # 一個從不會紅的 CI，比沒有 CI 更糟（同 02a 對測試載具的要求）。
  clock-check-can-fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: A node that cannot be read must fail the check
        run: |
          cat > /tmp/red.yaml <<'EOF'
          threshold_ms: 100
          reference: checker-host
          nodes:
            - name: checker-host
              probe: local
            - name: ghost
              probe: docker
              container: does-not-exist
          EOF
          if python -m purple.clock.cli --config /tmp/red.yaml; then
            echo "::error::時鐘檢查對讀不到的節點回報成功 —— 檢查已經失效"
            exit 1
          fi
          echo "檢查如預期失敗"

      - name: A broken config must fail the check
        run: |
          if python -m purple.clock.cli --config /tmp/does-not-exist.yaml; then
            echo "::error::缺少設定檔卻回報成功 —— 檢查已經失效"
            exit 1
          fi
          echo "檢查如預期失敗"
