name: Integration (compose deploy test)

# 部署測試：起真的 docker compose 全棧，打真 SQLi，驗證走完管線變成 Core Event。
# 比單元 CI 慢很多，所以獨立成一個 workflow。
on:
  push:
    branches: [master]
    # 純文件變更不值得起整個 compose 全棧（~5 分鐘）。程式/部署變更才跑。
    paths-ignore:
      - "**.md"
      - "**.svg"
      - ".scratch/**"
      - "docs/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "**.svg"
      - ".scratch/**"
      - "docs/**"
  workflow_dispatch:

jobs:
  admission-access-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test deps
        run: pip install -e ".[dev]"

      - name: Validate compose and nginx configuration
        run: |
          docker compose --profile admission-e2e config --quiet
          docker run --rm \
            -v "$PWD/deploy/edge/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Bring up the narrow access plane
        run: >-
          docker compose --profile admission-e2e up -d --build --wait --wait-timeout 180
          admission-edge admission-red-terminal admission-blue-terminal

      - name: Show access-plane services
        if: always()
        run: docker compose --profile admission-e2e ps

      - name: Run admission and WebSocket routing proof
        env:
          PURPLE_ACCESS_E2E: "1"
          PURPLE_AUTO_COMPOSE: "0"
          PURPLE_PG_DSN: postgresql://admission:admission-e2e@localhost:5433/admission
          PURPLE_ADMISSION_URL: http://localhost:8002
          PURPLE_EDGE_HOST: localhost
          PURPLE_EDGE_PORT: "8088"
        run: python -m pytest -v -s tests/integration/test_admission_access.py

      - name: Dump access-plane logs on failure
        if: failure()
        run: docker compose --profile admission-e2e logs --no-color --tail 200

      - name: Tear down access plane and volumes
        if: always()
        run: docker compose --profile admission-e2e down -v

  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test deps
        run: pip install -e ".[dev]"

      - name: Bring up the full stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Show what came up
        if: always()
        run: docker compose ps

      - name: Run end-to-end integration tests
        env:
          PURPLE_AUTO_COMPOSE: "0"
          PURPLE_PG_DSN: postgresql://purple:purple@localhost:5432/purple
          PURPLE_APP_URL: http://localhost:8080
          PURPLE_ENGINE_URL: http://localhost:8001
          PURPLE_LOKI_URL: http://localhost:3100
        # -v 逐條顯示測試名與 PASSED；-s 不吃掉 print，讓每階段 echo 即時可見
        run: python -m pytest -v -s -m integration

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
