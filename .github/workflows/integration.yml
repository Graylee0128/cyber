name: Integration (compose deploy test)

# 部署測試：起真的 docker compose 全棧，打真 SQLi，驗證走完管線變成 Core Event。
# 比單元 CI 慢很多，所以獨立成一個 workflow。
on:
  push:
    branches: [master]
    # 純文件變更不值得起整個 compose 全棧（~5 分鐘）。程式/部署變更才跑。
    paths-ignore:
      - "**.md"
      - "**.svg"
      - ".scratch/**"
      - "docs/**"
  pull_request:
    branches: [master]
    # draft 期間不跑：標成 ready 或推上 master 才值得起全棧。長期停在 draft
    # 的分支每推一次就燒 9 分鐘，是這個 workflow 最大的浪費來源。
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "**.svg"
      - ".scratch/**"
      - "docs/**"
  workflow_dispatch:

# 連推三次只跑最後一次。master 不取消 —— 那裡每個 commit 的結果都要留存。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 哪些檔案動了，決定下面兩個 9 分鐘的 job 各自要不要跑。
  # 這個 job 約 20 秒，換掉的是最多 18 分鐘。
  changes:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      access_plane: ${{ steps.filter.outputs.access_plane }}
      telemetry: ${{ steps.filter.outputs.telemetry }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "${BEFORE}" "${{ github.sha }}")
          else
            # 分支首推之類：比不出範圍就全跑，寧可多跑不可漏跑。
            changed=$(git ls-files)
          fi
          echo "變更檔案："
          echo "${changed}"

          # access plane：admission／edge nginx／range core／receiver／UI 這條路徑。
          access_plane=false
          if echo "${changed}" | grep -qE '^(src/(admission|range_core|purple/receiver|purple/response)/|deploy/(edge|admission)/|tests/access_integration/|docker-compose\.yml|\.github/workflows/integration\.yml)'; then
            access_plane=true
          fi

          # telemetry：Grafana→receiver→Core Event 這條管線與它的部署。
          telemetry=false
          if echo "${changed}" | grep -qE '^(src/purple/|deploy/(grafana|alloy|loki|prometheus|range-target|receiver)/|scenarios/|tests/integration/|docker-compose\.yml|\.github/workflows/integration\.yml)'; then
            telemetry=true
          fi

          echo "access_plane=${access_plane}" >> "$GITHUB_OUTPUT"
          echo "telemetry=${telemetry}" >> "$GITHUB_OUTPUT"
          echo "→ access_plane=${access_plane} telemetry=${telemetry}"

  admission-access-e2e:
    needs: changes
    if: needs.changes.outputs.access_plane == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test deps
        run: pip install -e ".[dev]"

      - name: Validate compose and nginx configuration
        run: |
          docker compose --profile admission-e2e config --quiet
          docker run --rm \
            -v "$PWD/deploy/edge/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Bring up the narrow access plane
        run: >-
          docker compose --profile admission-e2e up -d --build --wait --wait-timeout 240
          admission-edge admission-range-core admission-receiver
          admission-red-terminal admission-blue-terminal
          admission evaluation-api ui

      - name: Show access-plane services
        if: always()
        run: docker compose --profile admission-e2e ps

      - name: Run admission and WebSocket routing proof
        env:
          PURPLE_ACCESS_E2E: "1"
          PURPLE_AUTO_COMPOSE: "0"
          PURPLE_PG_DSN: postgresql://admission:admission-e2e@localhost:5433/admission
          PURPLE_ADMISSION_URL: http://localhost:8002
          PURPLE_RANGE_CORE_URL: http://localhost:8003
          PURPLE_EDGE_HOST: localhost
          PURPLE_EDGE_PORT: "8088"
          # #51：封鎖路徑的 Z-MGMT 端（Range Core 跨容器打的那一跳）。
          PURPLE_RECEIVER_URL: http://localhost:8004
          # #75/#76：Product UI 的 gateway。權限邊界住在 nginx 設定裡 ——
          # 只有經真的 nginx 打真的後端容器才驗得到。
          PURPLE_UI_URL: http://localhost:8090
        run: python -m pytest -v -s tests/access_integration/

      - name: Dump access-plane logs on failure
        if: failure()
        run: |
          docker compose --profile admission-e2e logs --no-color --tail 200
          # healthcheck 失敗時，錯誤訊息只留在 docker 的 health log 裡 ——
          # 容器 stdout 什麼都不會有，光看服務日誌會以為一切正常。
          for name in $(docker compose --profile admission-e2e ps -q); do
            echo "=== health: $(docker inspect -f '{{.Name}}' "$name") ==="
            docker inspect -f '{{json .State.Health}}' "$name" || true
          done

      - name: Tear down access plane and volumes
        if: always()
        run: docker compose --profile admission-e2e down -v

  # 分片跑。`--durations=15` 量到的分佈：三條測試吃掉 459 秒裡的 388 秒，
  # 其餘 14 條加起來 70 秒 —— 所以按檔案分沒用（三條在同一個檔），要按測試分。
  #
  # 為什麼是 job 層平行而不是 pytest-xdist：這些測試在**基礎設施**上彼此耦合。
  #   1. tests/conftest.py 的 pg_connection fixture 每條測試開頭 truncate_all，
  #      同 process 平行跑會在別人等事件的中途清掉資料
  #   2. 它們共用一台 Grafana／Loki／target app。test_pipeline_e2e.py 自己註解
  #      寫著要等 alert 退場「避免留下 firing 狀態污染後續測試的 60s 偵測視窗」
  # 每個分片起自己的 compose 棧，兩個耦合同時消失。
  #
  # 分片用 -k 指名，最後一片是 not(前三個)。有人改了測試名字：該片會因為收不到
  # 測試而 exit 5 直接紅，同時那條測試掉進最後一片照跑 —— 不會靜默漏測。
  compose-e2e:
    needs: changes
    if: needs.changes.outputs.telemetry == 'true'
    runs-on: ubuntu-latest
    # 不寫的話 job 名字會把整條 -k 運算式塞進去，check 列表沒法看。
    name: compose-e2e (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: sqli-detect
            select: "test_real_sqli_becomes_a_core_event"
          - shard: sqli-resolve
            select: "test_sqli_alert_resolves_after_attack_stops"
          - shard: evidence-api
            select: "test_evidence_api_returns_context_from_real_loki"
          - shard: rest
            select: >-
              not test_real_sqli_becomes_a_core_event
              and not test_sqli_alert_resolves_after_attack_stops
              and not test_evidence_api_returns_context_from_real_loki
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test deps
        run: pip install -e ".[dev]"

      - name: Bring up the full stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Show what came up
        if: always()
        run: docker compose ps

      - name: Run end-to-end integration tests
        env:
          PURPLE_AUTO_COMPOSE: "0"
          PURPLE_PG_DSN: postgresql://purple:purple@localhost:5432/purple
          PURPLE_APP_URL: http://localhost:8080
          PURPLE_ENGINE_URL: http://localhost:8001
          PURPLE_LOKI_URL: http://localhost:3100
        # -v 逐條顯示測試名與 PASSED；-s 不吃掉 print，讓每階段 echo 即時可見。
        # --durations 留著：分片比例日後會漂，要能看得出來該重新分。
        run: python -m pytest -v -s -m integration -k "${{ matrix.select }}" --durations=15

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
