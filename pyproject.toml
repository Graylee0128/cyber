[project]
name = "purple-platform"
version = "0.1.0"
description = "Purple Platform P1 — Telemetry & Detection Pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.1",
    "jinja2>=3.1"
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.10",
    "pytest>=8.0",
]

[project.scripts]
clock-check = "purple.clock.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "environment: 對真實環境斷言，不是 red-green-refactor（見 map.md 測試性質分級）",
    "integration: 需要 docker compose 全棧（Loki/Grafana/Alloy/…），只在 integration workflow 跑",
]
