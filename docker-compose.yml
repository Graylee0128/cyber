# 本機 / CI 的部署測試全棧（log 管線）。
#
# 真實鏈路：vulnerable-app 寫 log → Alloy 讀 → Loki → Grafana（唯一 alert engine，
# eval 10s）→ webhook → P1 receiver → PostgreSQL 的 Core Event / Alert Record。
# 外加 Prometheus 走 metric 路徑。
#
# 服務名 = source registry 的來源 id（spec §3.3）。單一指令 `docker compose up`
# 本機與 CI 一致（票 02a 的驗收條件）。
#
# 四區網段（票 #15，SA §12）：z-app / z-mgmt / z-target / z-red。靠 network
# membership 逼近隔離 —— 沒有共享 network 的兩個容器彼此不可達（連 DNS 都不解析）。
# 這能強制的：mgmt 住戶都在 z-mgmt、collector 在 target 側、RED 與 MGMT 結構隔離。
#
# compose **無法**忠實模擬的（委派 #13 / workstream 6）：
#   - 契約 2 的**方向**（TARGET→MGMT 單向）—— 共享 network 天生雙向；
#     prometheus 為了 scrape 必須同時上 z-target，這正是真防火牆會擋的 MGMT→TARGET
#     方向（真環境走 OTLP :4317 push 取代 scrape，見 #10/#11）
#   - z-mgmt 未設 internal:true —— E2E 測試在 host 端經 published port 打各服務，
#     internal 會切斷 host↔容器的 port 轉發。真單向防火牆屬 #13
#   - 真 VLAN/macvlan、六台 kali 可分辨 source IP
# z-app（Range Core／Product UI，WS5）與 z-red（六台 kali）在此 compose 無住戶，
# 定義出來以完整表達四區模型；真住戶在 #13 / WS5。

services:
  # #59 access-plane proof.  Every service in this slice is profile-gated so
  # the existing default telemetry stack keeps its current startup behavior.
  admission-postgres:
    image: postgres:17-alpine
    profiles: ["admission-e2e"]
    environment:
      POSTGRES_USER: admission
      POSTGRES_PASSWORD: admission-e2e
      POSTGRES_DB: admission
    ports:
      - "5433:5432"
    networks:
      - z-mgmt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission -d admission"]
      interval: 2s
      timeout: 3s
      retries: 15

  admission:
    build:
      context: .
      dockerfile: deploy/admission/Dockerfile
    profiles: ["admission-e2e"]
    environment:
      ADMISSION_PG_DSN: postgresql://admission:admission-e2e@admission-postgres:5432/admission
      ADMISSION_ONSITE_SECRET: e2e-site-secret
      ADMISSION_INSTRUCTOR_TOKEN: e2e-service-token
      ADMISSION_INSTRUCTOR_ACTOR: e2e-instructor
      ADMISSION_SESSION_TTL_SECONDS: "3600"
      # 教官瀏覽器 session（#126 item 2）——同一份 ADMISSION_INSTRUCTOR_TOKEN，
      # 只是多一種出示方式；12 小時涵蓋一整個活動日，跟上面玩家座位的 TTL
      # 分開調，互不連動。
      ADMISSION_INSTRUCTOR_SESSION_TTL_SECONDS: "43200"
      # 中控畫面（#76）的兩個動作：簽發一次性邀請連結、清理逾時的領位請求。
      # 這兩個變數沒配到時端點回 503 而不是壞掉 —— 但畫面上的按鈕就是死的。
      ADMISSION_REMOTE_LINK_TTL_SECONDS: "1800"
      ADMISSION_REQUEST_TIMEOUT_SECONDS: "300"
      ADMISSION_RANGE_CORE_URL: http://admission-range-core:8000
      ADMISSION_RANGE_CORE_TOKEN: e2e-admission-token
      # 本機 demo 沒有 TLS，`http://<區網 IP>:8090` 不是 secure context——`Secure`
      # cookie 在那裡會被瀏覽器直接丟掉，教官／玩家登入回 204 但下一個請求仍是
      # 403，沒有任何錯誤訊號（2026-08-16 .89 實測撞到）。這裡明確關閉，讓降級
      # 是看得見的選擇。**真的對外開放時必須刪掉這一行、補 TLS**，見 ui/README.md。
      ADMISSION_COOKIE_SECURE: "0"
    ports:
      - "8002:8000"
    networks:
      - z-app
      - z-mgmt
    depends_on:
      admission-postgres:
        condition: service_healthy
      admission-range-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket;s=socket.create_connection(('localhost',8000),2);s.close()\""]
      interval: 2s
      timeout: 3s
      retries: 20

  admission-range-core:
    build:
      context: .
      dockerfile: deploy/admission/Dockerfile.range-core
    profiles: ["admission-e2e"]
    environment:
      RANGE_CORE_PG_DSN: postgresql://admission:admission-e2e@admission-postgres:5432/admission
      RANGE_CORE_TOKEN_ADMISSION: e2e-admission-token
      # #51：封鎖路徑的兩端。Range Core（Z-APP 住戶）打 Z-MGMT 的
      # `/response/enqueue`——這對變數沒配到，`HttpResponseDispatcher` 會走
      # 「沒有 base_url／token」那條分支、每次 contain 都 dispatch_status=failed
      # 且不計分。上線前少配這兩個變數是靜默失效，所以 e2e 必須真的配上去，
      # 而不是只在單元測試裡對假伺服器驗過。
      RANGE_CORE_RESPONSE_TOKEN: e2e-response-token
      PURPLE_RESPONSE_URL: http://admission-receiver:8000
      RANGE_CORE_TOKEN_INSTRUCTOR: e2e-instructor-token
      RANGE_CORE_TOKEN_BLUE: e2e-blue-token
      # #126 item 4：唯一可以代 Player Portal 宣告來源 IP 的呼叫者 —— Product UI
      # 的 gateway（服務 token 本來就注入在那裡）。**不是** Z-EDGE：那一台必須
      # 維持零憑證（WS8 spec §5.3，被打下時不該連帶交出任何 token），而代宣告
      # 來源 IP 需要同時握有 Range Core 的服務 token。
      # 沒設這個變數時沒有任何位址可信，`X-Seat-Source-Ip` 一律被忽略（fail closed）。
      RANGE_CORE_TRUSTED_EDGE_HOST: ui
      # Product UI 的另外兩個 gateway 身分（#75）。沒配到的身分沒有合法 token，
      # 該 gateway 的每個請求都會 403 —— fail closed，不是預設放行。
      RANGE_CORE_TOKEN_RED: e2e-red-token
      RANGE_CORE_TOKEN_PURPLE: e2e-purple-token
    ports:
      - "8003:8000"
    volumes:
      # `scripts/range/build-vm-target.sh` 的 FLAG_SHARE_FILE 寫在**主機**這個
      # 路徑（range-up 每次重烤/重起靶機都重寫）；`src/range_core/flags.py` 的
      # `SharedFileFlagSource` 用同一個絕對路徑在**容器內**讀——兩邊路徑字面
      # 相同不代表看得到同一個檔，這裡原本沒有這個 mount，玩家提交 flag
      # 100% 撞 `FlagUnavailable`（pre-UAT 2026-08-17 發現：submission 型
      # objective 在真 scenario 上從未真的驗過）。唯讀：容器只比對，不寫入。
      - /var/lib/purplescope:/var/lib/purplescope:ro
    networks:
      - z-app
      - z-mgmt
    depends_on:
      admission-postgres:
        condition: service_healthy
      admission-receiver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket;s=socket.create_connection(('localhost',8000),2);s.close()\""]
      interval: 2s
      timeout: 3s
      retries: 20

  # #51：封鎖路徑的 Z-MGMT 端。跟預設 profile 的 `receiver` 是同一個映像與
  # 同一支程式，只是接 admission 那座 PostgreSQL——access-plane profile 自帶
  # 一套資料庫，兩個 profile 不共用狀態。這個容器存在的唯一理由是讓
  # Range Core → Z-MGMT 那一跳走真的網路，而不是測試行程內的假伺服器。
  admission-receiver:
    build:
      context: .
      dockerfile: deploy/receiver/Dockerfile
    profiles: ["admission-e2e"]
    environment:
      PURPLE_PG_DSN: postgresql://admission:admission-e2e@admission-postgres:5432/admission
      PURPLE_RECEIVER_PORT: "8000"
      RANGE_CORE_RESPONSE_TOKEN: e2e-response-token
    ports:
      - "8004:8000"
    networks:
      - z-mgmt
    depends_on:
      admission-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 2s
      timeout: 3s
      retries: 20

  admission-edge:
    image: nginx:1.27-alpine
    profiles: ["admission-e2e"]
    volumes:
      - ./deploy/edge/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8088:8080"
    # z-red／z-blue 拿掉了：兩個網路的 IPAM 子網刻意跟 OVS 的 Z-RED／Z-BLOW
    # 撞一樣（10.167.30.0/24／10.167.60.0/24），但只是 Docker 自己起的獨立
    # bridge，從沒接上 br-range——留著只會讓 Docker 幫這兩個子網裝的
    # connected route 跟 scripts/range/attach-edge.sh 加的路由打架，讓
    # ttyd 代理連線更難除錯，不是更容易。真正到紅／藍隊的路徑改由
    # attach-edge.sh 把這個容器接上 OVS 的 Z-EDGE（VLAN50）解決
    # （pre-UAT 2026-08-17：admission-edge 對紅／藍隊 ttyd 從未真的打通過）。
    networks:
      - z-edge
      - z-app
    depends_on:
      admission:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 2s
      timeout: 3s
      retries: 10

  admission-red-terminal:
    build:
      context: .
      dockerfile: deploy/edge/Dockerfile.stub
    profiles: ["admission-e2e"]
    environment:
      SEAT_ID: red
    networks:
      z-red:
        ipv4_address: 10.167.30.60
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket;s=socket.create_connection(('localhost',7681),2);s.close()\""]
      interval: 2s
      timeout: 3s
      retries: 10

  admission-blue-terminal:
    build:
      context: .
      dockerfile: deploy/edge/Dockerfile.stub
    profiles: ["admission-e2e"]
    environment:
      SEAT_ID: blue
    networks:
      z-blue:
        ipv4_address: 10.167.60.11
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket;s=socket.create_connection(('localhost',7681),2);s.close()\""]
      interval: 2s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: purple
      POSTGRES_PASSWORD: purple
      POSTGRES_DB: purple
    ports:
      - "5432:5432"
    networks:
      - z-mgmt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purple -d purple"]
      interval: 2s
      timeout: 3s
      retries: 15

  vulnerable-app:
    build:
      context: .
      dockerfile: deploy/vulnerable-app/Dockerfile
    environment:
      APP_LOG_PATH: /var/log/app/app.log
      # 票 #11：失敗登入計數用 OTLP push 到 Alloy:4317（取代 Prometheus scrape）。
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
    ports:
      - "8080:8080"
    volumes:
      - applogs:/var/log/app
    networks:
      - z-target
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')\""]
      interval: 3s
      timeout: 3s
      retries: 15

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./deploy/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - lokidata:/loki   # 具名 volume：retention 生效 + 磁碟量得到（票 #12）
    ports:
      - "3100:3100"
    networks:
      - z-mgmt
    # 刻意無 healthcheck：loki 3.x 是 distroless（gcr.io/distroless/static:nonroot），
    # 無 shell/wget/curl，結構上做不了容器內 healthcheck（2026-08-09 查證官方 Dockerfile）。
    # 它的就緒由 #16 的 smoke 從 host 探查詢 API :3100/loki/api/v1/labels 補上——不用
    # /ready（single-binary 的 /ready 帶 ring 延遲、與可查詢不一致），改證它真在服務
    # 查詢。故 loki 不在 MGMT_HEALTHCHECKED（topology_check.py）。

  # collector：在 target 側（契約 4）。透過共享 volume 讀 app log，經 z-mgmt push
  # 到 Loki —— 這條 z-target→z-mgmt 就是契約 1 的 TARGET→MGMT telemetry。
  alloy:
    image: grafana/alloy:v1.4.2
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - applogs:/var/log/app:ro
      # Falco 事件檔（票 #9）：Falco 寫、Alloy 讀，經共享 volume。
      - falcologs:/var/log/falco:ro
    ports:
      - "4317:4317"   # OTLP gRPC（票 #11）
    networks:
      - z-target
      - z-mgmt
    depends_on:
      loki:
        condition: service_started
      vulnerable-app:
        condition: service_healthy

  # Falco = runtime sensor（票 #9），部署在 target 側（z-target，非 z-mgmt）。
  # modern-eBPF / CO-RE：需 privileged 存取 host kernel（BTF 在 /sys）。事件用
  # file_output 寫 JSON 到共享 volume，Alloy tail 後推 Loki。只載自訂 rule（-r），
  # 不載預設數千條，events.json 才乾淨。CI 若 runner 不支援可能起不來——見 #9 註記。
  # profile "falco"：預設 `docker compose up` **不啟** Falco。
  # 已知限制（2026-08-09 大主機實測）：容器 Falco 需驅動吃得下 host kernel。
  #   - GitHub runner：modern-eBPF scap_init 失敗（環境不支援）。
  #   - 大主機 kernel 7.0.0-28（前沿/HWE）：modern-eBPF CO-RE relo 對不上（mm_struct.
  #     rss_stat 版面變更）；kmod 驅動源碼也不支援該 kernel。0.39.2/0.44.1 皆然。
  # 故容器 Falco 只在 kernel ≤ ~6.11 的 host 可跑。**真 Falco 的可運行部署改由 Slice 4
  # 的 golden VM（kernel 6.8，apt falco-modern-bpf.service）承載**（2b-① 已證），即
  # `range-up.sh --with-falco`。此 compose 服務保留給相容 kernel 的 host / CI 用。
  falco:
    image: falcosecurity/falco:0.44.1
    privileged: true
    profiles: ["falco"]
    command:
      - falco
      - -o
      - engine.kind=modern_ebpf
      - -o
      - json_output=true
      - -o
      - file_output.enabled=true
      - -o
      - file_output.filename=/var/log/falco/events.json
      - -o
      - stdout_output.enabled=true
      - -o
      - log_level=warning
      - -r
      - /etc/falco/rules.d/purplescope.yaml
    volumes:
      - ./deploy/falco/rules.d/purplescope.yaml:/etc/falco/rules.d/purplescope.yaml:ro
      - falcologs:/var/log/falco
      - /proc:/host/proc:ro   # 大主機：proc enrichment（container/proc metadata）
      # #62 Z-BLUE 規則要靠 container.name 認出 seat-blue-*（container.id 是
      # 動態的，規則不能寫死）；沒掛 docker.sock 之前 container.name 一律是
      # <NA>（實測驗證過），只有 container.id 有值。唯讀掛載。
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
    networks:
      - z-target

  prometheus:
    image: prom/prometheus:v2.54.1
    # 票 #11：改吃 OTLP remote_write（Alloy 從 :4317 轉來），不再 scrape 靶機。
    # remote-write receiver 要用 command flag 開。因此 Prometheus 純 z-mgmt 住戶，
    # **不再上 z-target** —— compose 這下真的沒有 MGMT→TARGET 那條疤了（契約 2）。
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - z-mgmt
    # busybox base（quay.io/prometheus/busybox）有 wget。-O /dev/null 比 --spider
    # 在各版 busybox 行為更一致；/-/healthy 非 200 → wget exit 非 0。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 3s
      timeout: 3s
      retries: 20

  receiver:
    build:
      context: .
      dockerfile: deploy/receiver/Dockerfile
    environment:
      PURPLE_PG_DSN: postgresql://purple:purple@postgres:5432/purple
      PURPLE_RECEIVER_PORT: "8000"
    ports:
      - "8000:8000"
    networks:
      - z-mgmt
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 3s
      timeout: 3s
      retries: 15

  # Evaluation Engine v0（Z-MGMT 住戶）：Evidence API。與 receiver 同映像，換指令。
  evaluation-engine:
    build:
      context: .
      dockerfile: deploy/receiver/Dockerfile
    command: ["python", "-m", "purple.evidence.service"]
    environment:
      PURPLE_PG_DSN: postgresql://purple:purple@postgres:5432/purple
      PURPLE_ENGINE_PORT: "8001"
      PURPLE_LOKI_URL: http://loki:3100
      # #52 B2：Console 的 identity 由這個 token 換出，不接受呼叫端自填。
      PURPLE_EVIDENCE_TOKEN_BLUE: "dev-blue-token"
      # Purple Console 與 Instructor Console 也要查證據（#26／#75）。
      # 每個身分各自的 token：一邊外洩不會換出另一邊的 clearance。
      PURPLE_EVIDENCE_TOKEN_PURPLE: "dev-purple-token"
      PURPLE_EVIDENCE_TOKEN_INSTRUCTOR: "dev-instructor-token"
      # #49：`Detection #N` 標籤的排序來源。image 只帶 src/ 與 config/，
      # 規則檔因此用 volume 掛進來。掛不到 → 標籤全空 → rule 欄位對紅藍完全拿掉
      # （fail closed：少一個欄位，不會多一個答案）。
      PURPLE_DETECTION_RULES_PATH: /app/detection-rules.yaml
    volumes:
      - ./deploy/grafana/provisioning/alerting/rules.yaml:/app/detection-rules.yaml:ro
    ports:
      - "8001:8001"
    networks:
      - z-mgmt
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/healthz')\""]
      interval: 3s
      timeout: 3s
      retries: 15

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
      # #162：Grafana 掛在 `/grafana/` 子路徑下（deploy/ui/default.conf.template
      # 的 `location /grafana/`），但 Grafana 自己完全不知道——未登入時它對任何
      # 頁面請求都回 302 到自己認知的 `/login`（站台根相對路徑，不含
      # `/grafana/` 前綴），落在 Product UI 的靜態根目錄，404。這不是偶發：
      # 每一次未登入存取都會 100% 撞到，Blue SOC「遙測儀表板」分頁因此從沒真的
      # 打開過。`/health/grafana` 不受影響——那條走固定路徑 `/api/health`，
      # 跟這個子路徑重寫是兩件事，所以 Instructor Console 的狀態燈一直是綠的，
      # 沒人發現這裡壞了。標準做法：這兩個變數必須成對設，只設一個等於沒設。
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Blue SOC 把這個畫面嵌在 iframe 裡給玩家看，不是給教官另外開分頁登入用——
      # iframe 裡卡一個登入牆，玩家連帳密在哪都不知道，等於這塊面板還是看不到
      # 東西。Viewer 角色只能看、不能改告警規則或資料源設定。
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - z-mgmt
    depends_on:
      loki:
        condition: service_started
      receiver:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    # grafana 映像是 alpine，有 curl（無 wget）。/api/health 回 200＝就緒。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  # #131：AI 輔助基礎設施，本機執行、不打外部 API。落點 Z-MGMT，跟 Grafana/Loki
  # 同側。用 `ai` profile（比照 falco 的開關方式，見 deploy.sh）——AI 是加分項，
  # 一個 profile 開關就能讓整段在拉不到 image／裝置資源不夠的機器上乾淨跳過，
  # 不會拖垮 `--wait` 卡住整個部署。
  #
  # healthcheck 只驗「server 有回應」（`ollama list` 成功），不等模型真的拉完——
  # 模型檔（~2GB）拉取交給 deploy.sh 在 compose up 之後另外做、且刻意 best-effort
  # （失敗只印警告，不阻斷部署）。健康檢查若連模型都要求，`--wait-timeout` 在
  # 慢連線上會整支腳本卡死，等於讓一顆選配服務綁架必要的部署路徑。
  ollama:
    image: ollama/ollama:0.3.14
    profiles: ["ai"]
    networks:
      - z-mgmt
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama   # 模型檔落這裡，不烤進 image；容器重建不用重拉
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30

  # WS4-P2 的 Evaluation API（`purple.evaluation.api`）—— Action Registry、
  # 四態判定、latency 摘要、Battleboard sanitized 投影、technique 判讀限制。
  #
  # **在這個 service 出現以前它沒有被部署過。** 既有的 `evaluation-engine`
  # 名字看起來像它，實際跑的是 `purple.evidence.service`（Evidence API），
  # 是不同的程式、不同的 port。Purple Console 與 Battleboard 要的端點因此在
  # 部署裡完全不存在 —— 單元測試全綠也照樣沒有出口，跟 #51 少配兩個環境變數
  # 是同一類的縫。
  evaluation-api:
    build:
      context: .
      dockerfile: deploy/admission/Dockerfile.range-core
    command: ["uvicorn", "purple.evaluation.api:app", "--host", "0.0.0.0", "--port", "8002"]
    profiles: ["admission-e2e"]
    environment:
      PURPLE_PG_DSN: postgresql://admission:admission-e2e@admission-postgres:5432/admission
      PURPLE_LOKI_URL: http://loki:3100
    ports:
      - "8005:8002"
    networks:
      - z-mgmt
    depends_on:
      admission-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8002/api/techniques')\""]
      interval: 3s
      timeout: 3s
      retries: 20

  # 六個產品畫面 ＋ 每身分一個的後端 gateway（WS7 #75／WS8 #76／WS4-P2 #26）。
  #
  # 服務 token 全部注入在**這裡**，不進瀏覽器。UI 同時上 z-app（Product UI 的
  # 歸屬區）與 z-mgmt（要打得到 Evaluation／Evidence／Admission）。
  ui:
    image: nginx:1.27-alpine
    profiles: ["admission-e2e"]
    volumes:
      - ./deploy/ui/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./ui:/usr/share/nginx/html:ro
    environment:
      UI_RANGE_CORE_UPSTREAM: admission-range-core:8000
      UI_EVALUATION_UPSTREAM: evaluation-api:8002
      UI_EVIDENCE_UPSTREAM: evaluation-engine:8001
      UI_ADMISSION_UPSTREAM: admission:8000
      UI_ADMISSION_EDGE_UPSTREAM: admission-edge:8080
      UI_GRAFANA_UPSTREAM: grafana:3000
      # 本機 demo 用的寬鬆值。**正式環境必須收斂到 Z-MGMT 網段** ——
      # 這一條是目前唯一擋得住「拿到網址就進得去教官控台」的東西。
      UI_PRIVILEGED_CIDR: 0.0.0.0/0
      RANGE_CORE_TOKEN_RED: e2e-red-token
      RANGE_CORE_TOKEN_BLUE: e2e-blue-token
      RANGE_CORE_TOKEN_PURPLE: e2e-purple-token
      RANGE_CORE_TOKEN_INSTRUCTOR: e2e-instructor-token
      PURPLE_EVIDENCE_TOKEN_BLUE: dev-blue-token
      PURPLE_EVIDENCE_TOKEN_PURPLE: dev-purple-token
      PURPLE_EVIDENCE_TOKEN_INSTRUCTOR: dev-instructor-token
      # 與 `admission` service 的 ADMISSION_INSTRUCTOR_TOKEN 必須相同 ——
      # 這是 Admission 自己的 token 命名空間，跟 Range Core 的那組無關。
      ADMISSION_INSTRUCTOR_TOKEN: e2e-service-token
    ports:
      - "8090:8080"
    networks:
      - z-app
      - z-mgmt
    depends_on:
      admission-range-core:
        condition: service_healthy
      evaluation-api:
        condition: service_healthy
    healthcheck:
      # **127.0.0.1，不是 localhost。** 這個 template 只有 `listen 8080`（IPv4），
      # 官方映像那支自動補 IPv6 listener 的腳本只改預設 conf、不改 template。
      # `localhost` 在容器裡先解到 ::1，於是 nginx 明明服務正常、healthcheck 卻
      # 一路 connection refused 到逾時。
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

# 四區網段（SA §12）。z-app / z-red 目前無住戶（見檔頭），定義出來以完整表達模型。
networks:
  z-app:
  z-edge:
  z-mgmt:
  z-target:
  z-red:
    ipam:
      config:
        - subnet: 10.167.30.0/24
  z-blue:
    ipam:
      config:
        - subnet: 10.167.60.0/24

volumes:
  applogs:
  falcologs:   # Falco 寫事件 JSON、Alloy 讀（票 #9）
  lokidata:    # Loki 資料，retention 與磁碟量測用（票 #12）
  ollamadata:  # Ollama 模型檔（票 #131），落 volume 不烤進 image
