apiVersion: 1

# 唯一 alert engine（ADR ③）。eval interval 10s（spec §1、票 03）。
# SQLi burst：對 Loki 數 sqli_suspected=true 的筆數，> 0 就 firing。
groups:
  - orgId: 1
    name: purple-detection
    folder: PurpleScope
    interval: 10s
    rules:
      - uid: sqli-injection-burst
        title: SQLInjectionBurst
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({app="vulnerable-app"} | json | sqli_suspected=`true` [1m]))'
              queryType: range
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        labels:
          event_type: attack.detected
          technique: T1190
          team: red
          severity: high
          scenario_id: sqli-01
          exercise_id: ex-001
          service: vulnerable-app
        annotations:
          query: '{app="vulnerable-app"} | json | sqli_suspected=`true`'
          threshold: "> 0 / 1m"
