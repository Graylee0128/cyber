                    type: gt
                    params: [0]
        labels:
          event_type: attack.detected
          technique: T1053
          team: red
          severity: high
          scenario_id: campus-diagnostics-persistence
          service: range-target
        annotations:
          query: '{job="falco"} |= `PurpleScope cron persistence write`'
          threshold: "> 0 / 1m"

      # Falco：靶機被生出 shell 直譯器（帶 PURPLESCOPE_EXEC 標記）→ T1059。
      # Falco 只提供事實（syscall 進 Loki），是否構成告警由這條 Grafana rule 決定
      # （ADR ③：Grafana 是唯一 alert engine，Falco 不直送 Event Service）。
      - uid: falco-command-exec
        title: FalcoCommandExec
        condition: A
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              # range app 把 TCP 對端放進 exec marker；regexp 擷取成 source_ip series label。
              # instant query（非 range/matrix）：每個 source_ip 各自一個樣本點，
              # 才會各自成為一個 alert instance、各自帶自己的 source_ip label。
              expr: 'sum by (source_ip) (count_over_time({job="falco"} |= `PurpleScope exec detected` | regexp `SOURCE_IP=(?P<source_ip>[0-9.]+)` [1m])) > 0'
              queryType: instant
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
        labels:
          event_type: attack.detected
          technique: T1059
          team: red
          severity: high
          scenario_id: falco-exec-01
          service: vulnerable-app
        annotations:
          query: '{job="falco"} |= `PurpleScope exec detected`'
          threshold: "> 0 / 1m"

      # SA §7 Scenario 03（Sensitive File Access）：Falco → Loki → Grafana → Incident。
      # 同樣是 Falco 只提供事實、Grafana 決定是否構成告警（ADR ③）。
      - uid: falco-sensitive-file
        title: FalcoSensitiveFileAccess
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({job="falco"} |= `PurpleScope sensitive file access` [1m]))'
              queryType: range
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        labels:
          event_type: attack.detected
          technique: T1005
          team: red
          severity: high
          scenario_id: falco-secret-03
          service: range-target
        annotations:
          query: '{job="falco"} |= `PurpleScope sensitive file access`'
          threshold: "> 0 / 1m"
