              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              expr: '{job="falco"} |= `PurpleScope webshell exec detected`'
              queryType: range
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        labels:
          event_type: attack.detected
          technique: T1505
          team: red
          severity: high
          scenario_id: campus-poster-foothold
          service: range-target
        annotations:
          query: '{job="falco"} |= `PurpleScope webshell exec detected`'
          threshold: "> 0 / 1m"

      # CH2 提權（T1548）：低權限 posterrender 帳號透過誤設的 sudo find 規則
