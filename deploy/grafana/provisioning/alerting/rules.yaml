apiVersion: 1

# 唯一 alert engine（ADR ③）。eval interval 10s（spec §1、票 03）。
# SQLi burst：對 Loki 數 sqli_suspected=true 的筆數，> 0 就 firing。
groups:
  - orgId: 1
    name: purple-detection
    folder: PurpleScope
    interval: 10s
    rules:
      - uid: sqli-injection-burst
        title: SQLInjectionBurst
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              # 以 source_ip 分 series，Grafana webhook 才會把實際攻擊來源帶進 Core Event；
              # response agent 只執行這個已治理的值，不自行猜測封鎖對象（#17）。
              #
              # 注意：falco-command-exec 有同款 by(source_ip) 分組，實測改成
              # queryType: instant 才能讓多來源同時 firing 時各自形成獨立 alert
              # instance（見 #17 commit bea5f2c）。這條規則刻意**沒有**跟著改──
              # 改了會讓這條規則在攻擊停止後於 60s 老化窗內反覆 firing/resolved
              # 閃動，每次閃動都重新 enqueue 一次封鎖指令（ingest_alert 的 enqueue
              # 不看 CoreEventStore 是否去重），T2 的
              # test_sqli_alert_resolves_after_attack_stops 因此觀察到 5 次
              # response.executed 而非 1 次、resolved 事件也對不上原本的 firing
              # event_id。目前沒有測試要求 SQLi 場景要撐多來源同時攻擊，維持原本
              # range+reduce+threshold 寫法，把 instant 的修法留給真的需要它、且
              # 一併處理閃動問題的後續票。
              expr: 'sum by (source_ip) (count_over_time({app="vulnerable-app"} | json | sqli_suspected=`true` [1m]))'
              queryType: range
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        labels:
          event_type: attack.detected
          technique: T1190
          team: red
          severity: high
          scenario_id: sqli-01
          service: vulnerable-app
        annotations:
          query: '{app="vulnerable-app"} | json | sqli_suspected=`true`'
          threshold: "> 0 / 1m"

      # 靶機 VM（golden，票 #44 的可計分攻擊面）的 SQLi。與上面 compose fixture 分屬兩台：
      # 這條看 app="range-target"，遙測經 target 側 Alloy 過真 VLAN 到 Z-MGMT Loki。
      #
      # by (source_ip, action_id)：source_ip 供封鎖對象（#17）；action_id 從 marker
      # 的 `action:<id>` regexp 抽出（harness.attacker 埋進 payload），讓同一 source
      # 的多次註冊攻擊各自成 series → 各自一個 firing → Evaluation 能以 action_id 關聯
      # 每次的偵測時間點（#90 Phase 4 的 latency 量測；分組不靠時間窗鄰近性）。marker
      # 沒帶 action 時 regexp 不匹配、label 缺席 → 併成空 action_id，行為與舊式一致。
      - uid: sqli-injection-burst-target
        title: SQLInjectionBurstTarget
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              expr: 'sum by (source_ip, action_id) (count_over_time({app="range-target"} | json | sqli_suspected=`true` | regexp `action:(?P<action_id>[A-Za-z0-9._-]+)` [1m]))'
              queryType: range
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        labels:
          event_type: attack.detected
          technique: T1190
          team: red
          severity: high
          scenario_id: sqli-target-44
          service: range-target
        annotations:
          query: '{app="range-target"} | json | sqli_suspected=`true`'
          threshold: "> 0 / 1m"

      # Brute force：走 metric（PromQL）而非 log。1 分鐘內失敗登入增量 > 10 才 firing，
      # 讓少量正常請求不會誤觸（負向 E2E 靠這個門檻不被 brute force 蓋過）。
      - uid: ssh-brute-force
        title: SSHBruteForce
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'sum(increase(ssh_failed_logins_total[1m]))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
        labels:
          event_type: attack.detected
          technique: T1110
          team: red
          severity: medium
          scenario_id: bruteforce-01
          service: vulnerable-app
        annotations:
          query: 'sum(increase(ssh_failed_logins_total[1m]))'
          threshold: "> 10 / 1m"

      # Falco：靶機被生出 shell 直譯器（帶 PURPLESCOPE_EXEC 標記）→ T1059。
      # Falco 只提供事實（syscall 進 Loki），是否構成告警由這條 Grafana rule 決定
      # （ADR ③：Grafana 是唯一 alert engine，Falco 不直送 Event Service）。
      - uid: falco-command-exec
        title: FalcoCommandExec
        condition: A
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              # range app 把 TCP 對端放進 exec marker；regexp 擷取成 source_ip series label。
              # instant query（非 range/matrix）：每個 source_ip 各自一個樣本點，
              # 才會各自成為一個 alert instance、各自帶自己的 source_ip label。
              expr: 'sum by (source_ip) (count_over_time({job="falco"} |= `PurpleScope exec detected` | regexp `SOURCE_IP=(?P<source_ip>[0-9.]+)` [1m])) > 0'
              queryType: instant
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
        labels:
          event_type: attack.detected
          technique: T1059
          team: red
          severity: high
          scenario_id: falco-exec-01
          service: vulnerable-app
        annotations:
          query: '{job="falco"} |= `PurpleScope exec detected`'
          threshold: "> 0 / 1m"

      # SA §7 Scenario 03（Sensitive File Access）：Falco → Loki → Grafana → Incident。
      # 同樣是 Falco 只提供事實、Grafana 決定是否構成告警（ADR ③）。
      - uid: falco-sensitive-file
        title: FalcoSensitiveFileAccess
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({job="falco"} |= `PurpleScope sensitive file access` [1m]))'
              queryType: range
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        labels:
          event_type: attack.detected
          technique: T1005
          team: red
          severity: high
          scenario_id: falco-secret-03
          service: range-target
        annotations:
          query: '{job="falco"} |= `PurpleScope sensitive file access`'
          threshold: "> 0 / 1m"
