          technique: T1059
          team: red
          severity: high
          scenario_id: campus-diagnostics-persistence
          service: range-target
        annotations:
          query: '{app="range-target"} | json | cmd_injection_suspected=`true`'
          threshold: "> 0 / 1m"

      # CH4 提權後半（T1053）：cron.d 下那個永遠不該存在的路徑被寫入。Falco 只提供
      # 事實，這條 Grafana rule 決定是否構成告警（ADR ③）。
      - uid: cron-persistence-target
        title: CronPersistenceTarget
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
