apiVersion: 1

# 唯一 alert engine（ADR ③）。eval interval 10s（spec §1、票 03）。
# SQLi burst：對 Loki 數 sqli_suspected=true 的筆數，> 0 就 firing。
groups:
  - orgId: 1
    name: purple-detection
    folder: PurpleScope
    interval: 10s
    rules:
      - uid: sqli-injection-burst
        title: SQLInjectionBurst
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({app="vulnerable-app"} | json | sqli_suspected=`true` [1m]))'
              queryType: range
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        labels:
          event_type: attack.detected
          technique: T1190
          team: red
          severity: high
          scenario_id: sqli-01
          exercise_id: ex-001
          service: vulnerable-app
        annotations:
          query: '{app="vulnerable-app"} | json | sqli_suspected=`true`'
          threshold: "> 0 / 1m"

      # Brute force：走 metric（PromQL）而非 log。1 分鐘內失敗登入增量 > 10 才 firing，
      # 讓少量正常請求不會誤觸（負向 E2E 靠這個門檻不被 brute force 蓋過）。
      - uid: ssh-brute-force
        title: SSHBruteForce
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'sum(increase(ssh_failed_logins_total[1m]))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
        labels:
          event_type: attack.detected
          technique: T1110
          team: red
          severity: medium
          scenario_id: bruteforce-01
          exercise_id: ex-001
          service: vulnerable-app
        annotations:
          query: 'sum(increase(ssh_failed_logins_total[1m]))'
          threshold: "> 10 / 1m"

      # Falco：靶機被生出 shell 直譯器（帶 PURPLESCOPE_EXEC 標記）→ T1059。
      # Falco 只提供事實（syscall 進 Loki），是否構成告警由這條 Grafana rule 決定
      # （ADR ③：Grafana 是唯一 alert engine，Falco 不直送 Event Service）。
      - uid: falco-command-exec
        title: FalcoCommandExec
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({job="falco"} |= `PurpleScope exec detected` [1m]))'
              queryType: range
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        labels:
          event_type: attack.detected
          technique: T1059
          team: red
          severity: high
          scenario_id: falco-exec-01
          exercise_id: ex-001
          service: vulnerable-app
        annotations:
          query: '{job="falco"} |= `PurpleScope exec detected`'
          threshold: "> 0 / 1m"
