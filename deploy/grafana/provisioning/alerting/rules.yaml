            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              expr: '{job="falco"} |= `PurpleScope cron persistence write`'
              queryType: range
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
