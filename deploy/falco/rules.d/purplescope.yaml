# PurpleScope 自訂 Falco rules（票 #9 / Slice 2b-②、Slice 4）。
#
# 這一份**同時**給兩處吃：
#   1. compose 的 falco 服務（相容 kernel 的 host）
#   2. golden 靶機 VM 內的 falco-modern-bpf（build-golden-target.sh 把本檔烤進 image）
# 只有一份來源，不會漂移。
#
# 條件刻意自足、不引用預設 macro/list —— falco 以 `-r 本檔` 載入時只有這些，
# 不載預設數千條，events.json 才乾淨、Alloy→Loki 才不被洗版。
#
# 三條規則都不再寫 `evt.dir=<`（2026-08-10 移除）。新版 libs 已不再產生 enter 事件，
# Falco 載入時會對每條帶 evt.dir 的規則發 LOAD_DEPRECATED_ITEM 警告，明說
# 「'evt.dir = <' always evaluates to true，可以移除」。留著只是每次啟動多噴幾十行
# 警告 —— 那些警告在 bake 失敗時還會把真正的死因從診斷視窗裡擠出去，實際害過一次。

# SA §7 Scenario 01/02 對應的執行面：T1059（Command and Scripting Interpreter）。
# 靶機 /exec 會跑 `/bin/sh -c "echo PURPLESCOPE_EXEC_<n>; id"`，execve 被 modern-eBPF 抓到。
- rule: PurpleScope Command Exec
  desc: T1059 - a scripting interpreter was spawned on the target with the purplescope marker
  condition: >
    evt.type=execve and
    proc.name in (sh, bash, dash, ash) and
    proc.cmdline contains PURPLESCOPE_EXEC
  output: "PurpleScope exec detected (cmd=%proc.cmdline pid=%proc.pid parent=%proc.pname container=%container.id)"
  priority: WARNING
  tags: [purplescope, T1059, execution]

# SA §7 Scenario 03：Sensitive File Access（Falco → Loki → Grafana → Incident）。
# 靶機 /readsecret 讀 /etc/purplescope/secret.txt —— 代表「敏感檔存取」這類動作。
# 用固定路徑而非 /etc/shadow：演練要可重現、可清除，且不需要真的碰系統憑證檔。
- rule: PurpleScope Sensitive File Access
  desc: T1005 - the designated sensitive file on the target was opened for read
  condition: >
    (evt.type in (open, openat, openat2)) and
    fd.name=/etc/purplescope/secret.txt
  output: "PurpleScope sensitive file access (file=%fd.name proc=%proc.name cmd=%proc.cmdline pid=%proc.pid)"
  priority: WARNING
  tags: [purplescope, T1005, collection]

# 決定性測試（ADR ③）的真環境素材：**刻意沒有對應的 Grafana 告警規則**。
#
# 靶機 /uncovered 會生一個帶 PURPLESCOPE_UNCOVERED 標記的 shell。Falco 抓得到、
# Alloy 推得進 Loki，所以「遙測在」是真的；但 deploy/grafana/provisioning/alerting
# 那邊查無此規則，所以不會有告警、不會有 Core Event。
#
# 這正是 D1 要能分辨的情形：看得到卻沒偵測到 ＝ DETECTION_GAP（偵測缺口），
# 而不是 VISIBILITY_GAP（根本沒看到）。若哪天有人幫這條加了 Grafana 規則，
# tests/integration/test_falco_range_chain.py 的決定性測試會紅 —— 那是刻意的護欄，
# 不是壞掉：這條規則的價值就在於它**不被覆蓋**。
- rule: PurpleScope Uncovered Action
  desc: deliberately un-alerted - telemetry exists but no detection rule covers it
  condition: >
    evt.type=execve and
    proc.name in (sh, bash, dash, ash) and
    proc.cmdline contains PURPLESCOPE_UNCOVERED
  output: "PurpleScope uncovered action (cmd=%proc.cmdline pid=%proc.pid parent=%proc.pname)"
  priority: NOTICE
  tags: [purplescope, uncovered]
