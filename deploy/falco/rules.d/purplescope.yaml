# PurpleScope 自訂 Falco rules（票 #9 / Slice 2b-②、Slice 4）。
#
# 這一份**同時**給兩處吃：
#   1. compose 的 falco 服務（相容 kernel 的 host）
#   2. golden 靶機 VM 內的 falco-modern-bpf（build-golden-target.sh 把本檔烤進 image）
# 只有一份來源，不會漂移。
#
# 條件刻意自足、不引用預設 macro/list —— falco 以 `-r 本檔` 載入時只有這些，
# 不載預設數千條，events.json 才乾淨、Alloy→Loki 才不被洗版。
#
# 三條規則都不再寫 `evt.dir=<`（2026-08-10 移除）。新版 libs 已不再產生 enter 事件，
# Falco 載入時會對每條帶 evt.dir 的規則發 LOAD_DEPRECATED_ITEM 警告，明說
# 「'evt.dir = <' always evaluates to true，可以移除」。留著只是每次啟動多噴幾十行
# 警告 —— 那些警告在 bake 失敗時還會把真正的死因從診斷視窗裡擠出去，實際害過一次。

# SA §7 Scenario 01/02 對應的執行面：T1059（Command and Scripting Interpreter）。
# 靶機 /exec 會在 shell cmdline 放 `PURPLESCOPE_EXEC_<n> SOURCE_IP=<tcp-peer>`；
# modern-eBPF 抓到 execve 後，Grafana 從輸出保留這個可信來源 IP 給 response agent。
- rule: PurpleScope Command Exec
  desc: T1059 - a scripting interpreter was spawned on the target with the purplescope marker
  condition: >
    evt.type=execve and
    proc.name in (sh, bash, dash, ash) and
    proc.cmdline contains PURPLESCOPE_EXEC
  output: "PurpleScope exec detected (cmd=%proc.cmdline pid=%proc.pid parent=%proc.pname container=%container.id)"
  priority: WARNING
  tags: [purplescope, T1059, execution]

# SA §7 Scenario 03：Sensitive File Access（Falco → Loki → Grafana → Incident）。
# 靶機 /readsecret 讀 /etc/purplescope/secret.txt —— 代表「敏感檔存取」這類動作。
# 用固定路徑而非 /etc/shadow：演練要可重現、可清除，且不需要真的碰系統憑證檔。
- rule: PurpleScope Sensitive File Access
  desc: T1005 - the designated sensitive file on the target was opened for read
  condition: >
    (evt.type in (open, openat, openat2)) and
    fd.name=/etc/purplescope/secret.txt
  output: "PurpleScope sensitive file access (file=%fd.name proc=%proc.name cmd=%proc.cmdline pid=%proc.pid)"
  priority: WARNING
  tags: [purplescope, T1005, collection]

# 決定性測試（ADR ③）的真環境素材：**刻意沒有對應的 Grafana 告警規則**。
#
# 靶機 /uncovered 會生一個帶 PURPLESCOPE_UNCOVERED 標記的 shell。Falco 抓得到、
# Alloy 推得進 Loki，所以「遙測在」是真的；但 deploy/grafana/provisioning/alerting
# 那邊查無此規則，所以不會有告警、不會有 Core Event。
#
# 這正是 D1 要能分辨的情形：看得到卻沒偵測到 ＝ DETECTION_GAP（偵測缺口），
# 而不是 VISIBILITY_GAP（根本沒看到）。若哪天有人幫這條加了 Grafana 規則，
# tests/integration/test_falco_range_chain.py 的決定性測試會紅 —— 那是刻意的護欄，
# 不是壞掉：這條規則的價值就在於它**不被覆蓋**。
- rule: PurpleScope Uncovered Action
  desc: deliberately un-alerted - telemetry exists but no detection rule covers it
  condition: >
    evt.type=execve and
    proc.name in (sh, bash, dash, ash) and
    proc.cmdline contains PURPLESCOPE_UNCOVERED
  output: "PurpleScope uncovered action (cmd=%proc.cmdline pid=%proc.pid parent=%proc.pname)"
  priority: NOTICE
  tags: [purplescope, uncovered]

# CH2 Foothold（校園海報上傳，#153 Campaign Pack v1）——「進階自訂範本」把 .py 副檔名
# 的海報當程式碼執行。這裡抓的是**結果**：靶機本身（python3 -u app.py）又子行程
# spawn 出一個 python3，且執行的檔案來自海報上傳目錄——這正是「網頁應用把使用者
# 上傳的東西當程式碼跑」的典型 syscall 特徵，不看攻擊者傳了什麼內容，只看「從上傳
# 目錄執行」這件事本身，才不會被 payload 花樣繞過。
- rule: PurpleScope WebShell Exec
  desc: T1505 - a python3 template execution spawned a python3 child running an uploaded poster
  condition: >
    evt.type=execve and
    proc.name=python3 and
    proc.cmdline contains "/var/lib/purplescope/posters/"
  output: "PurpleScope webshell exec detected (cmd=%proc.cmdline pid=%proc.pid parent=%proc.pname)"
  priority: WARNING
  tags: [purplescope, T1505, persistence]

# CH2 提權腳（T1548）：render 子行程已被 preexec_fn 降到低權限的 posterrender 帳號
# 執行（見 app.py `_drop_privileges_to_posterrender`）。golden VM 的 sudoers.d 誤設
# 放行 posterrender 以 root 執行 `find <posters目錄> <任意參數>`（見 bake.sh）——
# 這是 GTFOBins 已知的 find 提權型態：`sudo find <path> -exec /bin/sh \; -quit`
# 直接拿到 root shell。這條規則抓的正是這個 sudo 呼叫本身，不看之後那個 shell
# 長什麼樣（那會是攻擊者自訂內容，不該當偵測依據）。
- rule: PurpleScope Poster Sudo Find Abuse
  desc: T1548 - posterrender escalated via an overly broad sudo find rule (GTFOBins pattern)
  condition: >
    evt.type=execve and
    proc.name=sudo and
    proc.cmdline contains "find /var/lib/purplescope/posters"
  output: "PurpleScope poster sudo find abuse (cmd=%proc.cmdline pid=%proc.pid parent=%proc.pname)"
  priority: WARNING
  tags: [purplescope, T1548, privilege-escalation]

# #62 WS8 spec §6.2：Z-BLUE 座位帳號的 sudo allowlist v1 刻意留空（見
# deploy/blue-seat/sudoers.d/blue），所以**任何**一次 sudo 呼叫都值得記錄——
# 不是「密碼打錯」這種噪音，是「帳號嘗試了 allowlist 之外的事」本身。
#
# 這條證明的是 §6.7「host 層單一 Falco 觀察所有 seat 容器」不是空話：實測
# 過 host 這支 Falco（privileged + modern_ebpf）本來就看得到 seat-blue-*
# 容器裡的 syscall，不需要在容器內額外跑一份 Falco（那正是 §6.7 想避免的：
# 容器裡沒有 collector，玩家碰不到）。用 container.name 而非 container.id
# 認 seat——id 是每次建置都變的，name 遵守 `seat-blue-<terminal>-<uuid>`
# 這個固定前綴（見 scripts/range/seat_provisioner.py 的 BLUE_CONTAINER_PREFIX）。
- rule: PurpleScope Blue Seat Sudo Attempt
  desc: a blue seat account invoked sudo - v1 allowlist is empty, any attempt is notable
  condition: >
    evt.type=execve and
    proc.name=sudo and
    container.name startswith "seat-blue-"
  output: "PurpleScope blue seat sudo attempt (cmd=%proc.cmdline pid=%proc.pid container=%container.name)"
  priority: WARNING
  tags: [purplescope, T1548, privilege-escalation]
