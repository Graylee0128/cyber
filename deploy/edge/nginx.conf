events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;

        # Docker's embedded DNS is needed when proxy_pass uses the upstream
        # selected by Admission.  EDGE itself keeps no session/seat mapping.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $admission_upstream admission:8000;

        # 比對「這個 terminal id 之後任意子路徑」，不是精準單一段——原本只
        # 比對單一段會把 ttyd `--base-path` 的尾斜線重導向、`.../token`、
        # `.../ws` 全部漏接，跟瀏覽器來回無限重導向（pre-UAT 2026-08-17，
        # 詳見 deploy/ui/default.conf.template 對稱那條 location 的註解）。
        location ~ ^/terminal/(?<terminal>[A-Za-z0-9_-]+)(?:/.*)?$ {
            set $requested_terminal $terminal;
            auth_request /_auth_ttyd;
            auth_request_set $ttyd_upstream $upstream_http_x_ttyd_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;

            # Neither a client header nor the session cookie reaches the seat.
            proxy_set_header X-Ttyd-Upstream "";
            proxy_set_header Cookie "";
            proxy_pass http://$ttyd_upstream;
        }

        location = /_auth_ttyd {
            internal;
            proxy_pass http://$admission_upstream/admission/auth/ttyd/$requested_terminal;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Ttyd-Upstream "";
        }
    }
}
