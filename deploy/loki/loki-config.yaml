# 單機 Loki（部署測試用）。filesystem 儲存，inmemory ring —— 不做 HA，跑完即丟。
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# raw log 保留時段（票 #12 / ADR ⑩）：compactor 開 retention，過期即刪。
# 這裡設 168h（7d）作為演練後保留基準；純函式 retention/window.py 管「開/關窗」邏輯，
# 這段是 Loki 真的執行刪除的環境設定。量測見 scripts/range/measure-log-retention.sh。
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h
