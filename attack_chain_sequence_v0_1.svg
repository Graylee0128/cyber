<text class="ttl" x="24" y="34">單次攻防事件的跨元件時序 v0.1 —— 從一次 GET /exec 到封鎖生效</text>
<text class="sub" x="24" y="56">流程圖 B。時間由上往下。與 A（玩家旅程）相反：<tspan font-weight="700">這整條鏈是實線的</tspan> —— 每一步都由 T4 全鏈測試 tests/integration/test_falco_range_chain.py 守著。</text>

