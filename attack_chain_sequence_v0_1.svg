<svg width="2160" height="1450" viewBox="0 0 2160 1450" role="img" xmlns="http://www.w3.org/2000/svg">
<title>單次攻防事件的跨元件時序 v0.1 — 從一次 GET /exec 到封鎖生效與圍堵結束</title>
<desc>時間由上往下，縱線為元件生命線。紅隊容器打靶機 :80 起算，經 Falco 觀察 execve、Alloy 推 Loki 與 Prometheus、Grafana（唯一 alert engine，eval 10s）轉 Firing、webhook 進 Receiver 鑄造 event_id、命令入佇列、target 側 agent 每 2 秒主動 pull 並寫 ipset，最後回報 response.executed。三個延遲指標終點不同：MTTD 終於 Firing、MTTR 終於 ipset 寫入成功、containment duration 終於 Resolved。整條鏈由 T4 全鏈測試守著。</desc>
