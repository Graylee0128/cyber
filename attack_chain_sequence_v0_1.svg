<circle cx="67"  cy="220" r="4" fill="#185FA5"/><circle cx="137" cy="220" r="4" fill="#854F0B"/><circle cx="207" cy="220" r="4" fill="#5F5E5A"/>
<text class="axis" x="67"  y="626"  text-anchor="middle">MTTD</text>
<text class="axis" x="137" y="936"  text-anchor="middle">MTTR</text>
<text class="axis" x="207" y="1098" text-anchor="middle">containment</text>
<text class="tsub"   x="24"  y="240">t0 ＝ 攻擊發生</text>

<!-- ── 步驟 ─────────────────────────────────────────────── -->
<text class="step" x="463" y="212" text-anchor="middle">① GET /exec</text>
<text class="tsub"   x="463" y="226" text-anchor="middle">VLAN30 → VLAN20:80</text>
<path class="link" marker-end="url(#b)" d="M 380 234 H 540"/>

<text class="stepx" x="629" y="272" text-anchor="middle">② execve syscall</text>
<text class="tsub"    x="629" y="286" text-anchor="middle">Falco 被動觀察 kernel，非 app 上報</text>
<path class="link tel" marker-end="url(#bt)" d="M 546 294 H 706"/>

<text class="stepx" x="795" y="332" text-anchor="middle">③ Falco 事件（rules.d/purplescope.yaml）</text>
<path class="link tel" marker-end="url(#bt)" d="M 712 344 H 872"/>

<text class="stepx" x="1044" y="382" text-anchor="middle">④a log 路徑：push :3100（契約 1）</text>
<path class="link tel" marker-end="url(#bt)" d="M 878 394 H 1204"/>

<text class="stepx" x="1127" y="432" text-anchor="middle">④b metric 路徑：OTLP :4317 → remote_write</text>
<path class="link tel" marker-end="url(#bt)" d="M 878 444 H 1370"/>

<text class="step" x="1376" y="482" text-anchor="middle">⑤a LogQL 查詢（每 10s eval）</text>
<path class="link" marker-end="url(#b)" d="M 1210 494 H 1536"/>
<text class="step" x="1459" y="524" text-anchor="middle">⑤b PromQL 查詢</text>
<path class="link" marker-end="url(#b)" d="M 1376 536 H 1536"/>

<g class="mttd"><rect x="1444" y="558" width="196" height="50" rx="4"/>
  <text class="th" x="1542" y="579" text-anchor="middle">for: 0s → Firing</text>
  <text class="ts" x="1542" y="595" text-anchor="middle">★ MTTD 終點　~10s 地板</text></g>

<text class="step" x="1625" y="638" text-anchor="middle">⑥ webhook</text>
<text class="tsub"   x="1625" y="652" text-anchor="middle">group 10s／repeat 15s</text>
<path class="link" marker-end="url(#b)" d="M 1542 660 H 1702"/>

<g class="n-blue"><rect x="1606" y="678" width="204" height="66" rx="4"/>
  <text class="th" x="1708" y="699" text-anchor="middle">⑦ 順序不可顛倒</text>
  <text class="ts" x="1708" y="715" text-anchor="middle">鑄造 event_id → 寫 Alert Record</text>
  <text class="ts" x="1708" y="731" text-anchor="middle">→ 發 Core Event（attack.detected）</text></g>

<text class="stepa" x="1791" y="770" text-anchor="middle">⑧ enqueue 封鎖命令</text>
<text class="tsub"    x="1791" y="784" text-anchor="middle">receiver 不直寫 ipset</text>
<path class="link back" marker-end="url(#bb)" d="M 1708 792 H 1868"/>

<text class="stepa" x="1459" y="822" text-anchor="middle">⑨ GET /response/commands —— 每 2s 主動 pull，全程 outbound</text>
<path class="link back" marker-end="url(#bb)" d="M 1044 834 H 1868"/>
<path class="link back" marker-end="url(#bb)" d="M 1874 860 H 1050"/>

<g class="mttr"><rect x="946" y="878" width="196" height="66" rx="4"/>
  <text class="th" x="1044" y="899" text-anchor="middle">⑩ ipset ＋ iptables DROP</text>
  <text class="ts" x="1044" y="915" text-anchor="middle">兩者都成功才算生效</text>
  <text class="ts" x="1044" y="931" text-anchor="middle">★ MTTR 終點</text></g>

<text class="stepa" x="1376" y="974" text-anchor="middle">⑪ POST report → response.executed（帶 target.attack_event_id）</text>
<path class="link back" marker-end="url(#bb)" d="M 1044 986 H 1702"/>

<g class="n-red"><rect x="302" y="1006" width="322" height="50" rx="4"/>
  <text class="th" x="463" y="1027" text-anchor="middle">⑫ red4 打 :80 被擋，red5 仍通</text>
  <text class="ts" x="463" y="1043" text-anchor="middle">只封來源 IP，不是整段 —— T4 兩邊都斷言</text></g>
<path class="link red" marker-end="url(#br)" d="M 380 1064 H 540"/>
<text class="stepr" x="463" y="1082" text-anchor="middle">被 DROP</text>

<text class="step" x="1625" y="1102" text-anchor="middle">⑬ 攻擊停止 → Resolved（共用同一 event_id）</text>
<text class="tsub"   x="1625" y="1116" text-anchor="middle">★ containment duration 終點</text>
<path class="link" marker-end="url(#b)" d="M 1542 1124 H 1702"/>

<text class="step" x="1874" y="1152" text-anchor="middle">⑭ Core Event → Range Core／Battleboard／Blue SOC</text>
<path class="link" marker-end="url(#b)" d="M 1708 1164 H 2034"/>

<!-- ── 註記 ─────────────────────────────────────────────── -->
<rect class="notebox hi" x="24" y="1198" width="1032" height="106" rx="5"/>
<text class="tnk"   x="44" y="1224">★ 三個終點不同，混用會讓數字說謊</text>
<text class="tnote" x="44" y="1245">MTTD 終於 <tspan font-weight="700">Firing</tspan>（偵測到）；MTTR 終於 <tspan font-weight="700">ipset 寫入成功</tspan>（處置完成）；</text>
<text class="tnote" x="44" y="1264">containment duration 終於 <tspan font-weight="700">Resolved</tspan>（攻擊停了）。</text>
<text class="tnote" x="44" y="1283">最後一項<tspan font-weight="700">與藍隊做了什麼無關</tspan> —— 攻擊者自己收手也會 Resolved，不得當 MTTR 呈現。</text>

<rect class="notebox" x="1104" y="1198" width="1032" height="106" rx="5"/>
<text class="tnk"   x="1124" y="1224">為什麼中間非得有 Grafana 這一跳</text>
<text class="tnote" x="1124" y="1245">Falco 是 <tspan font-weight="700">sensor，不是 alert engine</tspan>：它的事件一律寫進 Loki，由 Grafana rule 決定構不構成告警。</text>
<text class="tnote" x="1124" y="1264">這樣才存在「telemetry 有、detection 沒有」的中間狀態，偵測缺口才可觀測（T4 的 /uncovered 就在測這個）。</text>
<text class="tnote" x="1124" y="1283">代價誠實寫在圖上：Grafana 成為單點，且 MTTD 有 ~10s 地板（ADR ③）。</text>

<rect class="notebox" x="24" y="1320" width="1032" height="106" rx="5"/>
<text class="tnk"   x="44" y="1346">⑧⑨ 為什麼 receiver 不自己去寫 ipset</text>
<text class="tnote" x="44" y="1367">直寫要從 Z-MGMT 連入 Z-TARGET，<tspan font-weight="700">當場破壞契約 2（TARGET → MGMT 單向）</tspan>。</text>
<text class="tnote" x="44" y="1386">所以 receiver 只把命令放進佇列，target 側 agent 每 2 秒自己來拿 —— 全程沒有任何連入 target 的 socket。</text>
<text class="tnote" x="44" y="1405">代價是最多 2 秒的 pull 延遲。與 A 圖 ④ 的 provisioner 是同一條邏輯：延遲換單向性。</text>

<rect class="notebox" x="1104" y="1320" width="1032" height="106" rx="5"/>
<text class="tnk"   x="1124" y="1346">Core Event 刻意不帶的東西</text>
<text class="tnote" x="1124" y="1367">⑦ 發出的 Core Event <tspan font-weight="700">沒有 evidence_ref</tspan>，也沒有任何 loki／logql／promql 字樣或 raw payload。</text>
<text class="tnote" x="1124" y="1386">遙測細節留在 Z-MGMT 的 Alert Record，兩份用同一個 event_id 對接；Console 要下鑽走 Evidence API。</text>
<text class="tnote" x="1124" y="1405">判準：<tspan font-weight="700">Core 不該帶自己永遠不讀的欄位</tspan> —— 換掉 Loki 時這份 schema 一個字都不用動。</text>

</svg>
