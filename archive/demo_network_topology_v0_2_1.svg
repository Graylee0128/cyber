<rect class="sub" x="1070" y="594" width="280" height="48" rx="6"/>
<text class="tl" x="1210" y="610" text-anchor="middle" dominant-baseline="central">每台 container 獨立 IP · ttyd :7681</text>
<text class="tl" x="1210" y="628" text-anchor="middle" dominant-baseline="central">seat 間 DOCKER-USER DROP</text>

<!-- G3 新增的兩區；保留 G2 四區主圖以凸顯世代差異。 -->
<rect class="zone" x="30" y="680" width="660" height="164" rx="12"/>
<text class="tz" x="50" y="706">Z-EDGE — ingress／會議中控平面</text>
<text class="tzs" x="50" y="726">VLAN 50 · 10.167.50.0/24 · G3 新增</text>
<g class="n-amber">
  <rect x="50" y="742" width="300" height="58" rx="6"/>
  <text class="th" x="64" y="761" dominant-baseline="central">nginx · TLS termination · ttyd proxy</text>
  <text class="ts" x="64" y="782" dominant-baseline="central">Internet :443 · EDGE→APP :443 · seat :7681</text>
</g>
<text class="tp deny" x="370" y="760">EDGE → MGMT deny all（契約 5）</text>
<text class="tp deny" x="370" y="782">EDGE → TARGET deny all</text>
<text class="tl" x="50" y="824">零持久化：無 DB、無 seat table、無 HMAC secret；ttyd 跑在 seat 容器內，不跑 host。</text>

<rect class="zone" x="710" y="680" width="660" height="164" rx="12"/>
<text class="tz" x="730" y="706">Z-BLUE — 防守平面</text>
<text class="tzs" x="730" y="726">VLAN 60 · 10.167.60.0/24 · G3 新增 · 每人一段</text>
<g class="n-blue">
  <rect x="730" y="742" width="300" height="58" rx="6"/>
  <text class="th" x="744" y="761" dominant-baseline="central">seat-bNN：DMZ a → internal b</text>
  <text class="ts" x="744" y="782" dominant-baseline="central">受限 shell + sudo allowlist · 非 root</text>
</g>
<text class="tp" x="1050" y="760">RED → BLUE allow :80（DMZ only）</text>
<text class="tp deny" x="1050" y="782">Falco／Alloy 設定與 unit 不得在 allowlist</text>
<text class="tl" x="730" y="824">seat 間 DOCKER-USER DROP；Z-TARGET 仍是無玩家 shell 的遙測基準線。</text>

<g transform="translate(0 180)">
<rect class="panel" x="30" y="690" width="1340" height="180" rx="10"/>
<text class="tz" x="50" y="716">firewall inter-VLAN 政策（G3 六區）</text>

<text class="tpk" x="50" y="748">RED → TARGET</text>
<text class="tp"  x="220" y="748">allow :80 :3306</text>
<text class="tl"  x="400" y="748">唯一攻擊面</text>
<text class="tpk" x="50" y="772">RED → APP</text>
<text class="tp"  x="220" y="772">allow :443</text>
<text class="tl"  x="400" y="772">Player Portal · Battleboard</text>
<text class="tpk" x="50" y="796">RED → MGMT</text>
<text class="tp deny" x="220" y="796">deny all</text>
<text class="tl"  x="400" y="796">觀測平面不得成為攻擊面</text>
<text class="tpk" x="50" y="820">TARGET → MGMT</text>
<text class="tp"  x="220" y="820">allow :3100 :9090 :4317</text>
<text class="tl"  x="400" y="820">telemetry 單向</text>

<text class="tpk" x="720" y="748">TARGET → APP</text>
<text class="tp"  x="880" y="748">allow :443</text>
<text class="tl"  x="1050" y="748">response agent pull 指令</text>
<text class="tpk" x="720" y="772">APP → MGMT</text>
<text class="tp"  x="880" y="772">allow Evaluation API</text>
<text class="tl"  x="1050" y="772">不開放 raw LogQL / PromQL</text>
<text class="tpk" x="720" y="796">MGMT → APP</text>
<text class="tp"  x="880" y="796">allow :443</text>
<text class="tl"  x="1050" y="796">Grafana Alert webhook</text>
<text class="tpk" x="720" y="820">APP／MGMT → TARGET</text>
<text class="tp deny" x="880" y="820">deny</text>
<text class="tl"  x="1050" y="820">保住 telemetry 單向</text>

<text class="tpk" x="50" y="844">EDGE → MGMT</text>
<text class="tp deny" x="220" y="844">deny all</text>
<text class="tl" x="400" y="844">契約 5；匿名入口不得觸及觀測平面</text>
<text class="tpk" x="720" y="844">五條跨世代契約</text>
<text class="tl" x="880" y="844">前三 port／單向／RED deny／target collector／EDGE deny</text>

<text class="tl" x="700" y="866" text-anchor="middle" dominant-baseline="central">G3：六區（Z-APP／Z-MGMT／Z-TARGET／Z-RED／Z-EDGE VLAN 50／Z-BLUE VLAN 60）＋五條契約；K8s 順延至 G4。</text>
</g>
</svg>
