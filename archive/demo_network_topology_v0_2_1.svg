  <text class="ts" x="700" y="74" text-anchor="middle" dominant-baseline="central">inter-VLAN policy · .1 on each VLAN</text>
</g>

<line class="link" x1="700" y1="94" x2="700" y2="140"/>
<text class="tl" x="712" y="120" dominant-baseline="central">802.1Q trunk</text>

