  <text class="ts" x="656" y="552" text-anchor="end" dominant-baseline="central">.21</text>
</g>
<g class="n-gray">
  <rect x="390" y="594" width="280" height="48" rx="6"/>
  <text class="th" x="404" y="618" dominant-baseline="central">host-b · mgmt NIC</text>
  <text class="ts" x="656" y="618" text-anchor="end" dominant-baseline="central">.22</text>
</g>

<rect class="zone" x="710" y="270" width="320" height="394" rx="12"/>
<text class="tz" x="730" y="296">Z-TARGET — shared attack surface</text>
<text class="tzs" x="730" y="316">VLAN 20 · 10.167.20.0/24 · no player shell</text>

<g class="n-blue">
  <rect x="730" y="330" width="280" height="48" rx="6"/>
  <text class="th" x="744" y="348" dominant-baseline="central">web-target</text>
  <text class="ts" x="744" y="366" dominant-baseline="central">vulnerable-app :80 · db :3306</text>
  <text class="ts" x="996" y="348" text-anchor="end" dominant-baseline="central">.10</text>
</g>
