  <text class="ts" x="404" y="432" dominant-baseline="central">query · alerting · webhook out</text>
  <text class="ts" x="656" y="414" text-anchor="end" dominant-baseline="central">.12</text>
</g>
<g class="n-teal">
  <rect x="390" y="462" width="280" height="48" rx="6"/>
  <text class="th" x="404" y="480" dominant-baseline="central">Evaluation Engine</text>
