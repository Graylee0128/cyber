<svg width="1400" height="1085" viewBox="0 0 1400 1085" role="img" xmlns="http://www.w3.org/2000/svg">
<title>demo-network 拓樸 v0.3 — G3 六區＋會議中控</title>
<desc>G3 六區拓樸：G2 的 Z-APP、Z-MGMT、Z-TARGET、Z-RED 之上新增 Z-EDGE（VLAN 50）與 Z-BLUE（VLAN 60）。Z-EDGE 零持久化，Admission Service 與座位池留在 Z-APP；新增第五條跨世代契約 EDGE→MGMT deny all。</desc>
<style>
  text { font-family: "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; font-weight: 400; }
  .tz { font-size: 15px; font-weight: 600; fill: #2C2C2A; }
  .tzs { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .tl { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .tp { font-size: 12px; font-weight: 400; fill: #2C2C2A; }
  .tpk { font-size: 12px; font-weight: 600; fill: #2C2C2A; }
  .deny { fill: #A32D2D; font-weight: 600; }
  .zone { fill: none; stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 5 5; }
  .sub { fill: none; stroke: #D3D1C7; stroke-width: 1; stroke-dasharray: 3 3; }
  .panel { fill: #FBFAF6; stroke: #B4B2A9; stroke-width: 1; }
  .link { stroke: #888780; stroke-width: 1.3; fill: none; }
  .n-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.8; }
  .n-purple .th { fill: #26215C; } .n-purple .ts { fill: #534AB7; }
  .n-teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.8; }
  .n-teal .th { fill: #04342C; } .n-teal .ts { fill: #0F6E56; }
  .n-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.8; }
  .n-blue .th { fill: #042C53; } .n-blue .ts { fill: #185FA5; }
  .n-red rect { fill: #FCEBEB; stroke: #A32D2D; stroke-width: 0.8; }
  .n-red .th { fill: #501313; } .n-red .ts { fill: #A32D2D; }
  .n-amber rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.8; }
  .n-amber .th { fill: #412402; } .n-amber .ts { fill: #854F0B; }
  .n-gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.8; }
  .n-gray .th { fill: #2C2C2A; } .n-gray .ts { fill: #5F5E5A; }
</style>

<rect x="0" y="0" width="1400" height="1085" fill="#FFFFFF"/>

<g class="n-amber">
