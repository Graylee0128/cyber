  <rect x="730" y="462" width="280" height="48" rx="6"/>
  <text class="th" x="744" y="480" dominant-baseline="central">Falco</text>
  <text class="ts" x="744" y="498" dominant-baseline="central">runtime detection · syscall</text>
</g>
<g class="n-blue">
  <rect x="730" y="528" width="280" height="48" rx="6"/>
