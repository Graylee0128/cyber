<svg width="1100" height="730" viewBox="0 0 1100 730" role="img" xmlns="http://www.w3.org/2000/svg">
<title>demo-network 拓樸 v0.2 — 三區隔離設計</title>
<desc>Firewall 做 inter-VLAN 政策，L2 switch 下分 Z-MGMT 觀測平面、Z-TARGET 攻擊面、Z-RED 紅隊執行環境三個 VLAN。</desc>
<style>
  text { font-family: "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; font-weight: 400; }
  .tz { font-size: 15px; font-weight: 600; fill: #2C2C2A; }
  .tzs { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .tl { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .zone { fill: none; stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 5 5; }
  .sub { fill: none; stroke: #D3D1C7; stroke-width: 1; stroke-dasharray: 3 3; }
  .link { stroke: #888780; stroke-width: 1.3; fill: none; }
  .n-teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.8; }
  .n-teal .th { fill: #04342C; } .n-teal .ts { fill: #0F6E56; }
  .n-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.8; }
  .n-blue .th { fill: #042C53; } .n-blue .ts { fill: #185FA5; }
  .n-red rect { fill: #FCEBEB; stroke: #A32D2D; stroke-width: 0.8; }
  .n-red .th { fill: #501313; } .n-red .ts { fill: #A32D2D; }
  .n-amber rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.8; }
  .n-amber .th { fill: #412402; } .n-amber .ts { fill: #854F0B; }
  .n-gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.8; }
  .n-gray .th { fill: #2C2C2A; } .n-gray .ts { fill: #5F5E5A; }
</style>

<rect x="0" y="0" width="1100" height="730" fill="#FFFFFF"/>

<g class="n-amber">
  <rect x="400" y="30" width="300" height="64" rx="8"/>
  <text class="th" x="550" y="54" text-anchor="middle" dominant-baseline="central">Firewall / L3 gateway</text>
  <text class="ts" x="550" y="74" text-anchor="middle" dominant-baseline="central">inter-VLAN policy · .1 on each VLAN</text>
</g>

<line class="link" x1="550" y1="94" x2="550" y2="140"/>
<text class="tl" x="562" y="120" dominant-baseline="central">802.1Q trunk</text>

<g class="n-gray">
  <rect x="400" y="140" width="300" height="64" rx="8"/>
  <text class="th" x="550" y="164" text-anchor="middle" dominant-baseline="central">L2 switch</text>
  <text class="ts" x="550" y="184" text-anchor="middle" dominant-baseline="central">VLAN 10 / 20 / 30</text>
</g>

<line class="link" x1="550" y1="204" x2="550" y2="236"/>
<line class="link" x1="196" y1="236" x2="904" y2="236"/>
<line class="link" x1="196" y1="236" x2="196" y2="270"/>
<line class="link" x1="550" y1="236" x2="550" y2="270"/>
