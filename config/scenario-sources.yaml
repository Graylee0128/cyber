# Scenario 對遙測來源的期望清單（Issue #18、ADR 0001 ⑧）。
#
# 這是 expected 的單一定義處；不得從執行中的 container／systemd unit 反推。
# heartbeat 只描述如何從既有 Loki telemetry 讀取「最後活著的時間」，不改變 expected。

sources:
  - id: falco
    heartbeat:
      provider: loki
      # Falco 有事件或原生 30s metrics snapshot 時都會更新這個 stream。
      query: '{job="falco"}'

  - id: alloy
    heartbeat:
      provider: loki
      # target app 每 30s 寫 canary；只有 Alloy 還能轉送時 Loki 才看得到。
      query: '{app="range-target"} |= "alloy.heartbeat"'

  - id: response-agent
    heartbeat:
      provider: loki
      # agent 每次成功 pull 後寫一筆；Alloy 以獨立 stream 轉送。
      query: '{job="response-agent"}'

# 真 scenario 的 expected_sources 以 scenarios/<id>/metadata.yaml 為準（#42）；這裡的
# 條目是 P2 evaluation 解析 source registry 的入口，兩邊必須一致（#47 落地第一個真 scenario）。
# 在 #47 之前這裡刻意留空（WS2 從零起，spec §6.2）；#47 是**唯一**該回填它的票。
scenarios:
  - id: shopdb-credential-pivot
    expected_sources: [alloy, response-agent]

  # CH2 Foothold（校園海報上傳，#153 Campaign Pack v1）。比 shopdb 多 falco——
  # 偵測靠 Falco 抓 syscall（webshell exec、sudo find 濫用），不是 app-log metric。
  - id: campus-poster-foothold
    expected_sources: [falco, alloy, response-agent]

  # CH3 The Stolen Key（校園網址預覽 SSRF，#153 Campaign Pack v1）。走 app-log
  # metric（ssrf_suspected），不需要 falco——與 shopdb 同款來源組合。
  - id: campus-preview-metadata-pivot
    expected_sources: [alloy, response-agent]

  # CH4 Ghost in the System（校園報修診斷工具，#153 Campaign Pack v1）。比 shopdb
  # 多 falco——持久化寫入偵測靠 Falco watch cron.d 固定路徑。
  - id: campus-diagnostics-persistence
    expected_sources: [falco, alloy, response-agent]

  # FINAL The Leak（校園學生資料自助查詢 IDOR，#153 Campaign Pack v1）。走 app-log
  # metric（token 核發速率），不需要 falco——與 shopdb 同款來源組合。
  - id: campus-student-records-idor
    expected_sources: [alloy, response-agent]

# 這五個 id 不是 scenario —— 它們是驗證 pipeline／registry 機制用的測試載具
# （sqli-01／bruteforce-01 只在 compose 存在；falco-* 是刻意的一鍵觸發端點）。
# 見 #43：id 字串不改，只搬區塊，讓查詢 API 能區分「這是 scenario 還是 fixture」。
fixtures:
  - id: sqli-01
    expected_sources: [alloy, response-agent]

  - id: bruteforce-01
    expected_sources: [alloy, response-agent]

  - id: falco-exec-01
    expected_sources: [falco, alloy, response-agent]

  - id: falco-secret-03
    expected_sources: [falco, alloy, response-agent]

  - id: falco-uncovered-01
    expected_sources: [falco, alloy, response-agent]

  # 靶機 VM 的可計分 SQLi（票 #44 攻擊面；#90 Phase 4 latency 量測的來源）。
  # 遙測經 target 側 Alloy → Z-MGMT Loki，來源與 falco-* 同一台 VM。
  - id: sqli-target-44
    expected_sources: [alloy, response-agent]
