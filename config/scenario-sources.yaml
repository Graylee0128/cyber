# Scenario 對遙測來源的期望清單（Issue #18、ADR 0001 ⑧）。
#
# 這是 expected 的單一定義處；不得從執行中的 container／systemd unit 反推。
# heartbeat 只描述如何從既有 Loki telemetry 讀取「最後活著的時間」，不改變 expected。

sources:
  - id: falco
    heartbeat:
      provider: loki
      # Falco 有事件或原生 30s metrics snapshot 時都會更新這個 stream。
      query: '{job="falco"}'

  - id: alloy
    heartbeat:
      provider: loki
      # target app 每 30s 寫 canary；只有 Alloy 還能轉送時 Loki 才看得到。
      query: '{app="range-target"} |= "alloy.heartbeat"'

  - id: response-agent
    heartbeat:
      provider: loki
      # agent 每次成功 pull 後寫一筆；Alloy 以獨立 stream 轉送。
      query: '{job="response-agent"}'

# 真 scenario 的 expected_sources 由 scenarios/<id>/metadata.yaml 提供（#42）。
# WS2 的真實起點是零個 scenario；這裡刻意留空，不得回填（spec §6.2）。
scenarios: []

# 這五個 id 不是 scenario —— 它們是驗證 pipeline／registry 機制用的測試載具
# （sqli-01／bruteforce-01 只在 compose 存在；falco-* 是刻意的一鍵觸發端點）。
# 見 #43：id 字串不改，只搬區塊，讓查詢 API 能區分「這是 scenario 還是 fixture」。
fixtures:
  - id: sqli-01
    expected_sources: [alloy, response-agent]

  - id: bruteforce-01
    expected_sources: [alloy, response-agent]

  - id: falco-exec-01
    expected_sources: [falco, alloy, response-agent]

  - id: falco-secret-03
    expected_sources: [falco, alloy, response-agent]

  - id: falco-uncovered-01
    expected_sources: [falco, alloy, response-agent]
