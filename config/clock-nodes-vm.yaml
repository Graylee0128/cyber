# T4 credential-free VM clock proof.
#
# Loki stores the collector ingestion timestamp beside the source timestamp in
# each JSON line.  Their delta includes VM skew plus Alloy transport latency, so
# 5s is a conservative upper bound rather than the 100ms direct-probe threshold.
# Falco and Alloy are systemd units in the same VM and therefore share this one
# kernel clock; app.ts and Falco.time independently exercise that clock while
# Alloy transports both streams.  Missing streams/timestamps fail closed.

threshold_ms: 5000
reference: checker-host

nodes:
  - name: checker-host
    probe: local
  - name: range-target-app-via-alloy
    probe: loki_ingest_delta
    selector: '{app="range-target"} | json | ts != ""'
    timestamp_field: ts
  - name: range-target-falco-via-alloy
    probe: loki_ingest_delta
    selector: '{job="falco"} | json | time != ""'
    timestamp_field: time
