# 時鐘同步檢查的節點清單（票 01）
#
# 無服務的 CI 基線只驗 checker host。T2 使用 clock-nodes-compose.yaml
# 直接進容器讀秒；T4 使用 clock-nodes-vm.yaml 的 Loki ingestion 上界探測。
#
# 每加一個遙測來源，就要在這裡加一個節點 —— 沒列進來的節點不會被檢查，
# 而不被檢查的時鐘遲早會漂。

threshold_ms: 100

# 基準時間源。必須是下方 nodes 之一。
reference: checker-host

nodes:
  - name: checker-host
    probe: local
