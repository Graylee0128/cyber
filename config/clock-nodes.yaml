# 時鐘同步檢查的節點清單（票 01）
#
# 現況：Z-TARGET / Z-MGMT 網段尚未建置（workstream 6），所以這裡只有檢查主機
# 自己。等 Alloy / Falco / Loki / Grafana 容器起來，把 docker 節點取消註解。
#
# 每加一個遙測來源，就要在這裡加一個節點 —— 沒列進來的節點不會被檢查，
# 而不被檢查的時鐘遲早會漂。

threshold_ms: 100

# 基準時間源。必須是下方 nodes 之一。
reference: checker-host

nodes:
  - name: checker-host
    probe: local

