# Technique 白名單（spec §5、ADR ⑤）。
#
# 單一檔案，scenario 定義時固定。Grafana rule label 與紅隊動作註冊清單
# **共用同一份** —— 兩邊對不起來，coverage 表就永遠算不平。
#
# 層級必須統一：不可一邊 T1190、另一邊 T1190.001。父技術與其子技術不可同時出現，
# 否則 coverage 會重複計數（載入時會擋下）。
#
# `note` 承載判讀限制，Console 顯示 technique 時一併呈現。

techniques:
  - id: T1190
    name: Exploit Public-Facing Application
    tactic: initial-access
  - id: T1078
    name: Valid Accounts
    tactic: initial-access
  - id: T1110
    name: Brute Force
    tactic: credential-access
    note: 需與成功登入證據連結後，才可敘述成入侵路徑
  - id: T1059
    name: Command and Scripting Interpreter
    tactic: execution
  - id: T1005
    name: Data from Local System
    tactic: collection
    note: 僅代表敏感檔被開啟，未證明內容外流；要敘述成外洩需另有傳輸證據
  # --- 提權／逃逸半邊（2026-08-13 補：單機縱深 spec §3.3 的後半，原 #42 未涵蓋）---
  - id: T1552
    name: Unsecured Credentials
    tactic: credential-access
    note: 僅代表憑證被讀取（.git、設定檔等），未證明後續使用；要敘述成入侵路徑需另有使用該憑證的證據
  - id: T1053
    name: Scheduled Task/Job
    tactic: execution
    note: cron/at 觸發的執行；要敘述成提權需連結「以較高權限身分被觸發」的證據
  - id: T1548
    name: Abuse Elevation Control Mechanism
    tactic: privilege-escalation
    note: 涵蓋 SUID、sudo 設定濫用與 Linux capabilities 提權；子技術不另立，統一記父技術
  - id: T1611
    name: Escape to Host
    tactic: privilege-escalation
    note: 容器逃逸至宿主；需有跨越容器邊界的證據，僅取得容器內 root 不足以敘述成逃逸
  - id: T1505
    name: Server Software Component
    tactic: persistence
    note: web shell 等伺服器端元件植入；子技術（.003 Web Shell）不另立，統一記父技術
  # --- CH3 The Stolen Key（校園 SSRF，#153 Campaign Pack v1）新增 ---
  - id: T1550
    name: Use Alternate Authentication Material
    tactic: lateral-movement
    note: 用竊得的憑證/token 存取原本需要授權的資源；僅有 SSRF 讀到憑證不構成本技術，
      需另有實際使用該憑證存取資源的證據
