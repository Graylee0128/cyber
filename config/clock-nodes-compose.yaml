# T2 compose sources are directly readable with docker exec, so retain the
# platform's precise 100ms threshold. Falco is optional on kernel 7 hosts and
# is covered by the VM boot probe against the MGMT namespace's independent HTTP Date.
threshold_ms: 100
reference: checker-host
nodes:
  - name: checker-host
    probe: local
  - name: alloy
    probe: docker
    container: alloy
  - name: loki
    probe: docker
    container: loki
  - name: grafana
    probe: docker
    container: grafana
  - name: vulnerable-app
    probe: docker
    container: vulnerable-app
