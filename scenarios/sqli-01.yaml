id: sqli-01
name: SQL Injection
difficulty: easy
duration: 30m

objectives:
  - id: discover_endpoint
    evaluation: telemetry
    points: 100
  - id: trigger_sqli
    evaluation: telemetry
    points: 200
  - id: capture_flag
    evaluation: submission
    points: 500

hints:
  - objective_id: discover_endpoint
    text: Inspect the application routes exposed by the target.
    penalty_percent: 25
  - objective_id: capture_flag
    text: Inspect the response body after the injection succeeds.
    penalty_percent: 50

attack_mapping:
  - T1190

target:
  type: web
  service: vulnerable-app

telemetry:
  - app_log
  - http_metric

detection:
  - SQLInjectionBurst
