<g class="n-amber">
  <rect x="734" y="624" width="156" height="60" rx="8"/>
  <text class="th" x="812" y="646" text-anchor="middle" dominant-baseline="central">Physical Appliance</text>
  <text class="ts" x="812" y="666" text-anchor="middle" dominant-baseline="central">軟硬結合掛載點</text>
