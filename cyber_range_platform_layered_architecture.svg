<svg width="940" height="800" viewBox="0 0 940 800" role="img" xmlns="http://www.w3.org/2000/svg">
<title>資安攻防平台四層系統架構（對齊 v0.2.1 拓樸）</title>
<desc>由上而下分為 Product UI、Cyber Range Core、Purple Platform、Scenario 與 Range Infrastructure 四層。每層右上角標示所屬網段：Product UI 與 Cyber Range Core 在 Z-APP，Purple Platform 在 Z-MGMT（collection 與 response agent 在 Z-TARGET），Scenario 與 Range Infrastructure 在 Z-TARGET。Purple Platform 內以 P1（Telemetry &amp; Detection Pipeline）與 P2（Evaluation &amp; Console）標示兩個工作包。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  text { font-family: "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif; }
  .layer { fill: none; stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 4 4; }
  .ln { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 11px; font-weight: 400; }
  .tag { font-size: 10px; font-weight: 600; }
  .chip { font-size: 11px; font-weight: 600; }
  .foot { font-size: 12px; font-weight: 400; fill: #52514E; }
  .arw { fill: none; stroke: #888781; stroke-width: 1.5; }
  .n-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.6; }
  .n-purple .th { fill: #3C3489; } .n-purple .ts { fill: #534AB7; }
  .n-teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.6; }
  .n-teal .th { fill: #085041; } .n-teal .ts { fill: #0F6E56; }
  .n-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.6; }
  .n-blue .th { fill: #0C447C; } .n-blue .ts { fill: #185FA5; }
  .n-rust rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.6; }
  .n-rust .th { fill: #712B13; } .n-rust .ts { fill: #993C1D; }
  .n-amber rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.9; }
  .n-amber .th { fill: #412402; } .n-amber .ts { fill: #854F0B; }
  .ptag rect { fill: #2C2C2A; }
  .ptag text { fill: #FFFFFF; }
</style>

<rect x="0" y="0" width="940" height="800" fill="#FFFFFF"/>

<!-- ══ Layer 1 · Product UI ══ -->
<rect class="layer" x="30" y="50" width="880" height="118" rx="12"/>
<text class="ln" x="50" y="76">Product UI</text>
<g><rect x="800" y="58" width="90" height="22" rx="11" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
   <text class="chip" x="845" y="69" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Z-APP</text></g>

<g class="n-purple">
  <rect x="50" y="88" width="156" height="60" rx="8"/>
  <text class="th" x="128" y="110" text-anchor="middle" dominant-baseline="central">Player Portal</text>
  <text class="ts" x="128" y="130" text-anchor="middle" dominant-baseline="central">mission · flag · score</text>
</g>
<g class="n-purple">
  <rect x="221" y="88" width="156" height="60" rx="8"/>
