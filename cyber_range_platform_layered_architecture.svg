<line class="arw" x1="320" y1="554" x2="320" y2="582" marker-end="url(#arrow)"/>
<line class="arw" x1="620" y1="582" x2="620" y2="554" marker-end="url(#arrow)"/>

<!-- ══ Layer 4 · Scenario / Range Infrastructure ══ -->
<rect class="layer" x="30" y="586" width="880" height="118" rx="12"/>
<text class="ln" x="50" y="612">Scenario / Range Infrastructure</text>
<g><rect x="778" y="594" width="112" height="22" rx="11" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
   <text class="chip" x="834" y="605" text-anchor="middle" dominant-baseline="central" fill="#712B13">Z-TARGET</text></g>

<g class="n-rust">
  <rect x="50" y="624" width="156" height="60" rx="8"/>
