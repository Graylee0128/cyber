<text class="foot" x="470" y="732" text-anchor="middle" dominant-baseline="central">左側向下＝控制流（API、指令、response）　右側向上＝資料流（telemetry、event、score）　層右上角＝所屬網段，見 v0.2.1 拓樸</text>
<text class="foot" x="470" y="756" text-anchor="middle" dominant-baseline="central">P1 ＝ Telemetry &amp; Detection Pipeline（產出標準化事件流）　P2 ＝ Evaluation &amp; Console（引擎在 Z-MGMT、Console 在 Z-APP，只吃 P1 的 schema）</text>
<text class="foot" x="470" y="778" text-anchor="middle" dominant-baseline="central">Physical Appliance 遵守同一條 telemetry 契約（syslog → Alloy → :3100 :9090 :4317 單向），接實體設備時 Purple Platform 不需改動</text>
</svg>
