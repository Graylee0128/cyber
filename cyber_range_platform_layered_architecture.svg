</g>
<g class="n-rust">
  <rect x="221" y="624" width="156" height="60" rx="8"/>
  <text class="th" x="299" y="646" text-anchor="middle" dominant-baseline="central">Hosts</text>
  <text class="ts" x="299" y="666" text-anchor="middle" dominant-baseline="central">Linux · Windows</text>
</g>
<g class="n-rust">
  <rect x="392" y="624" width="156" height="60" rx="8"/>
  <text class="th" x="470" y="646" text-anchor="middle" dominant-baseline="central">Runtime</text>
  <text class="ts" x="470" y="666" text-anchor="middle" dominant-baseline="central">Container · VM</text>
</g>
<g class="n-rust">
  <rect x="563" y="624" width="156" height="60" rx="8"/>
  <text class="th" x="641" y="646" text-anchor="middle" dominant-baseline="central">Lifecycle</text>
  <text class="ts" x="641" y="666" text-anchor="middle" dominant-baseline="central">reset · isolate</text>
