</g>

<line class="arw" x1="320" y1="400" x2="320" y2="428" marker-end="url(#arrow)"/>
<line class="arw" x1="620" y1="428" x2="620" y2="400" marker-end="url(#arrow)"/>

<!-- ══ Layer 3 · Purple Platform ══ -->
<rect class="layer" x="30" y="432" width="880" height="118" rx="12"/>
<text class="ln" x="50" y="458">Purple Platform</text>
<g><rect x="782" y="440" width="108" height="22" rx="11" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
   <text class="chip" x="836" y="451" text-anchor="middle" dominant-baseline="central" fill="#085041">Z-MGMT</text></g>

<g class="n-blue">
  <rect x="50" y="470" width="156" height="60" rx="8"/>
  <text class="th" x="128" y="492" text-anchor="middle" dominant-baseline="central">Collection</text>
  <text class="ts" x="128" y="512" text-anchor="middle" dominant-baseline="central">Alloy · Falco ＠Z-TARGET</text>
</g>
<g class="ptag"><rect x="172" y="476" width="26" height="15" rx="4"/><text class="tag" x="185" y="484" text-anchor="middle" dominant-baseline="central">P1</text></g>
<g class="n-blue">
  <rect x="221" y="470" width="156" height="60" rx="8"/>
  <text class="th" x="299" y="492" text-anchor="middle" dominant-baseline="central">Ingest &amp; Storage</text>
  <text class="ts" x="299" y="512" text-anchor="middle" dominant-baseline="central">Prometheus · Loki</text>
</g>
<g class="ptag"><rect x="343" y="476" width="26" height="15" rx="4"/><text class="tag" x="356" y="484" text-anchor="middle" dominant-baseline="central">P1</text></g>
<g class="n-blue">
  <rect x="392" y="470" width="156" height="60" rx="8"/>
  <text class="th" x="470" y="492" text-anchor="middle" dominant-baseline="central">Detection</text>
  <text class="ts" x="470" y="512" text-anchor="middle" dominant-baseline="central">Grafana Alert · Falco</text>
</g>
<g class="ptag"><rect x="514" y="476" width="26" height="15" rx="4"/><text class="tag" x="527" y="484" text-anchor="middle" dominant-baseline="central">P1</text></g>
<g class="n-blue">
  <rect x="563" y="470" width="156" height="60" rx="8"/>
  <text class="th" x="641" y="492" text-anchor="middle" dominant-baseline="central">Response</text>
  <text class="ts" x="641" y="512" text-anchor="middle" dominant-baseline="central">agent pull · ipset</text>
</g>
<g class="ptag"><rect x="685" y="476" width="26" height="15" rx="4"/><text class="tag" x="698" y="484" text-anchor="middle" dominant-baseline="central">P1</text></g>
<g class="n-blue">
  <rect x="734" y="470" width="156" height="60" rx="8"/>
