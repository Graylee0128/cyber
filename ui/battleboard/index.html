<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battleboard</title>
<link rel="stylesheet" href="../assets/base.css">
<style>
  .header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: linear-gradient(90deg, var(--red-dim), var(--panel-board) 40%, var(--panel-board) 60%, var(--blue-dim));
    border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 28px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .header .vs { font-size: 22px; font-weight: 800; letter-spacing: 0.02em; }
  .header .vs .r { color: var(--red); }
  .header .vs .b { color: var(--blue); }
  .header .meta { font-size: 15px; color: var(--muted); font-weight: 600; }
  .score-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .score-row .team { font-size: 16px; font-weight: 700; }
  .score-row .val { font-size: 32px; font-weight: 800; }
  .dot {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border);
  }
  .dot.pending { color: var(--muted); }
  .dot.breached { color: var(--red); border-color: #6b2430; background: var(--red-dim); }
  .dot.defended { color: var(--green); border-color: #1f6b47; background: #0f2a1c; }
  .dot.progress { color: var(--amber); border-color: #6b551f; }
  .chain { display: flex; gap: 8px; flex-wrap: wrap; }
  .disclosure-note {
    margin-top: 14px; padding: 10px 12px; background: #1a1530; border: 1px solid #3a2f66;
    border-radius: 6px; font-size: 12px; color: #c9b8ff;
  }
</style>
</head>
<body class="board">

<div class="header">
  <div class="vs"><span class="r">🔴 RED</span> vs <span class="b">🔵 BLUE</span></div>
  <div class="meta" id="scenario">—</div>
  <div class="meta" id="timer">—</div>
</div>

<div id="banner" class="banner"></div>

<div class="grid c3">
  <div class="panel">
    <div class="panel-title">比分</div>
    <div class="score-row">
      <span class="team" style="color:var(--red)">RED</span>
      <span class="val" id="score-red" style="color:var(--red)">—</span>
    </div>
    <div class="score-row">
      <span class="team" style="color:var(--blue)">BLUE</span>
      <span class="val" id="score-blue" style="color:var(--blue)">—</span>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">攻防進度（匿名化）</div>
    <div class="chain" id="chain"></div>
    <div class="disclosure-note" id="disclosure-note"></div>
  </div>

  <div class="panel">
    <div class="panel-title">戰況統計</div>
    <div id="defense"></div>
    <div class="note" id="defense-note"></div>
  </div>
</div>

<div class="panel">
  <div class="panel-title">Objective 進度</div>
  <div class="stat-row" style="border:none;padding-bottom:0">
    <span>已完成</span><span class="val" id="objective-fraction">—</span>
  </div>
  <div class="bar"><div class="fill" id="objective-bar" style="width:0%"></div></div>
</div>

<div class="panel">
  <div class="panel-title"><span class="dot-live" id="live"></span>戰況時間軸（Sanitized Event）</div>
  <div id="timeline"></div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
