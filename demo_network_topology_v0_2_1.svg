<text class="tz" x="730" y="296">Z-TARGET — attack surface</text>
<text class="tzs" x="730" y="316">VLAN 20 · 10.167.20.0/24</text>

<g class="n-blue">
  <rect x="730" y="330" width="280" height="48" rx="6"/>
  <text class="th" x="744" y="348" dominant-baseline="central">web-target</text>
