<rect class="sub" x="1070" y="594" width="280" height="48" rx="6"/>
<text class="tl" x="1210" y="618" text-anchor="middle" dominant-baseline="central">macvlan · 每台 container 獨立 IP</text>

<rect class="panel" x="30" y="690" width="1340" height="152" rx="10"/>
<text class="tz" x="50" y="716">firewall inter-VLAN 政策（v0.2.1）</text>

<text class="tpk" x="50" y="748">RED → TARGET</text>
<text class="tp"  x="220" y="748">allow :80 :3306</text>
<text class="tl"  x="400" y="748">唯一攻擊面</text>
<text class="tpk" x="50" y="772">RED → APP</text>
<text class="tp"  x="220" y="772">allow :443</text>
<text class="tl"  x="400" y="772">Player Portal · Battleboard</text>
<text class="tpk" x="50" y="796">RED → MGMT</text>
<text class="tp deny" x="220" y="796">deny all</text>
<text class="tl"  x="400" y="796">觀測平面不得成為攻擊面</text>
<text class="tpk" x="50" y="820">TARGET → MGMT</text>
<text class="tp"  x="220" y="820">allow :3100 :9090 :4317</text>
<text class="tl"  x="400" y="820">telemetry 單向</text>

<text class="tpk" x="720" y="748">TARGET → APP</text>
<text class="tp"  x="880" y="748">allow :443</text>
<text class="tl"  x="1050" y="748">response agent pull 指令</text>
<text class="tpk" x="720" y="772">APP → MGMT</text>
<text class="tp"  x="880" y="772">allow Evaluation API</text>
<text class="tl"  x="1050" y="772">不開放 raw LogQL / PromQL</text>
<text class="tpk" x="720" y="796">MGMT → APP</text>
<text class="tp"  x="880" y="796">allow :443</text>
<text class="tl"  x="1050" y="796">Grafana Alert webhook</text>
<text class="tpk" x="720" y="820">APP／MGMT → TARGET</text>
<text class="tp deny" x="880" y="820">deny</text>
<text class="tl"  x="1050" y="820">保住 telemetry 單向</text>

<text class="tl" x="700" y="868" text-anchor="middle" dominant-baseline="central">與 v0.2 的差異：新增 Z-APP（VLAN 40）；Battleboard／Portal／Range Core 自 Z-MGMT 遷出，修正「Portal 在 MGMT 但 RED→MGMT deny all」的衝突；Z-MGMT 只留觀測與評估。</text>
