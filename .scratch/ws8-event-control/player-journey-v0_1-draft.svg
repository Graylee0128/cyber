<!-- ── 註記 ───────────────────────────────────────────────── -->
<rect class="notebox hi" x="24" y="968" width="1032" height="96" rx="5"/>
<text class="tnk"   x="44" y="994">★ 為什麼身分在 ③ 鑄造，不在 ② 驗證</text>
<text class="tnote" x="44" y="1015">現場進場碼是<tspan font-weight="700">全場共用</tspan>的 —— 一百個人輸入同一組碼，驗證器沒有任何資訊可以區分他們。</text>
<text class="tnote" x="44" y="1034">把身分綁在憑據上的設計，在現場路徑上直接壞掉。所以驗證只回一個 boolean，</text>
<text class="tnote" x="44" y="1053">player_id 是配到座位那一刻才誕生的（WS8 spec §2.1）。</text>

<rect class="notebox" x="1104" y="968" width="1032" height="96" rx="5"/>
<text class="tnk"   x="1124" y="994">WS8 在 ③ 之後就退出 —— 圖上它沒有 ⑤⑥⑦</text>
<text class="tnote" x="1124" y="1015">中控只擁有身分／座位／會話。Exercise state 與 score 屬 WS5、telemetry 屬 WS4。</text>
<text class="tnote" x="1124" y="1034">它<tspan font-weight="700">不得成為第二個遊戲狀態的真相來源</tspan> —— 同 SA §3.2 對 Grafana 講過的那句話。</text>
<text class="tnote" x="1124" y="1053">中控畫面上刻意沒有分數欄，就是這條線的具體表現。</text>

<rect class="notebox" x="24" y="1080" width="1032" height="96" rx="5"/>
<text class="tnk"   x="44" y="1106">④ 的等待是刻意的，不是效能疏忽</text>
<text class="tnote" x="44" y="1127">中控只寫 seat(requested)，由 host 側 agent 輪詢後回寫 —— <tspan font-weight="700">pull，不是 push</tspan>。</text>
<text class="tnote" x="44" y="1146">push 會讓網路平面上的服務成為「可主動對 host 下指令」的來源，與契約 2 同一條邏輯：</text>
<text class="tnote" x="44" y="1165">延遲換單向性。50+ 規模也把 range-up.sh 從一次性 IaC 變成常駐服務（#62）。</text>

<rect class="notebox" x="1104" y="1080" width="1032" height="96" rx="5"/>
<text class="tnk"   x="1124" y="1106">實作狀態：這張圖只有 ⑥ 那條藍線是真的跑得動的</text>
<text class="tnote" x="1124" y="1127">實線框＝已實作並有測試（Purple 那條鏈由 T4 全鏈測試守著）。虛線框＝草案或未開工：</text>
