<svg width="2160" height="1210" viewBox="0 0 2160 1210" role="img" xmlns="http://www.w3.org/2000/svg">
<title>玩家旅程 v0.1 草案 — 一場演練從報到到結算的七個階段與六條泳道</title>
<desc>橫軸為時間（① 報到 → ② 入場 → ③ 領號 → ④ 環境配置 → ⑤ 開演 → ⑥ 攻防迴圈 → ⑦ 結算），縱軸為元件泳道（玩家、Z-EDGE、Admission Service、Seat Provisioner、Range Core、Purple Platform）。全圖唯一的身分產生點在階段 ③：憑據驗證只輸出 boolean，player_id 是配到座位那一刻才鑄造的。WS8 在 ③ 交出 player_id 後退出，不參與 ⑤⑥⑦。</desc>
