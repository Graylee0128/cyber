# P2 Latency Baseline（#90 Phase 4）
#
# 20 個同技法（T1190）的 SQLi 註冊動作，唯一目的是把 detection latency 量到
# 統計上站得住的 20 個樣本（p50/p95）。每個 action 各自的 action_id 讓偵測層
# （SQLInjectionBurstTarget，by source_ip, action_id）各自 firing，Evaluation
# 以 action_id 逐次關聯，不靠時間窗鄰近性。這不是敘事型 scenario —— 它是量測載具。
id: p2-latency-baseline
name: P2 Latency Baseline
difficulty: baseline
duration: 30m
